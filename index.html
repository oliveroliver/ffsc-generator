/* KiCad 7+ board. KiCad's Y axis points down, so Y is negated throughout.
   Pads become filled zones (press 'B' in KiCad to pour them); the
   reinforcement outline goes to F.Adhes, the board outline to Edge.Cuts. */
function build_kicad_text() {
  const k = x => String(Math.round(x * 10000) / 10000);
  const NL = '\n';
  let body = '';

  const arc_points = g => {
    const sweep = g.ccw ? mod2pi(g.a2 - g.a1) : -mod2pi(g.a1 - g.a2);
    const at = a => [g.cx + g.r * Math.cos(a), g.cy + g.r * Math.sin(a)];
    return { s: at(g.a1), m: at(g.a1 + sweep / 2), e: at(g.a1 + sweep) };
  };

  // board outline
  for (const p of primitives) {
    if (p.layer !== outline_layer_number) continue;
    if (p.type === 'wire') {
      body += `  (gr_line (start ${k(p.x1)} ${k(-p.y1)}) (end ${k(p.x2)} ${k(-p.y2)}) (width 0.1) (layer "Edge.Cuts"))` + NL;
    } else {
      const g = p.type === 'fillet' ? p : eagleArcGeometry(p);
      if (!g) continue;
      const a = arc_points(g);
      body += `  (gr_arc (start ${k(a.s[0])} ${k(-a.s[1])}) (mid ${k(a.m[0])} ${k(-a.m[1])}) (end ${k(a.e[0])} ${k(-a.e[1])}) (width 0.1) (layer "Edge.Cuts"))` + NL;
    }
  }

  // copper
  for (const p of primitives) {
    if (p.layer !== top_layer_number || p.net === null || p.net === undefined) continue;
    if (p.type === 'wire') {
      body += `  (segment (start ${k(p.x1)} ${k(-p.y1)}) (end ${k(p.x2)} ${k(-p.y2)}) (width ${k(p.width)}) (layer "F.Cu") (net ${p.net + 1}))` + NL;
    } else if (p.type === 'arc') {
      const g = eagleArcGeometry(p);
      if (!g) continue;
      const a = arc_points(g);
      body += `  (arc (start ${k(a.s[0])} ${k(-a.s[1])}) (mid ${k(a.m[0])} ${k(-a.m[1])}) (end ${k(a.e[0])} ${k(-a.e[1])}) (width ${k(p.width)}) (layer "F.Cu") (net ${p.net + 1}))` + NL;
    } else if (p.type === 'polygon') {
      // pad rectangle: expand the inset vertex ring back to the true outer edge
      const pts = p.points.slice(0, 4);
      const c = pts.reduce((a2, q) => [a2[0] + q.x / 4, a2[1] + q.y / 4], [0, 0]);
      const u = [pts[1].x - pts[0].x, pts[1].y - pts[0].y];
      const v = [pts[3].x - pts[0].x, pts[3].y - pts[0].y];
      const norm = w2 => { const l = Math.hypot(...w2); return l ? [w2[0] / l, w2[1] / l] : [0, 0]; };
      const un = norm(u), vn = norm(v), h = p.width / 2;
      const signs = [[-1, -1], [1, -1], [1, 1], [-1, 1]];
      const outer = pts.map((q, idx) => [
        q.x + signs[idx][0] * un[0] * h + signs[idx][1] * vn[0] * h,
        q.y + signs[idx][0] * un[1] * h + signs[idx][1] * vn[1] * h,
      ]);
      const xy = outer.map(q => `(xy ${k(q[0])} ${k(-q[1])})`).join(' ');
      body += `  (zone (net ${p.net + 1}) (net_name "net_${p.net}") (layer "F.Cu") (hatch edge 0.5)` + NL;
      body += `    (connect_pads (clearance 0.2)) (min_thickness 0.05) (filled_areas_thickness no)` + NL;
      body += `    (fill yes (thermal_gap 0.2) (thermal_bridge_width 0.2))` + NL;
      body += `    (polygon (pts ${xy})))` + NL;
    }
  }

  // vias
  for (const p of primitives) {
    if (p.type !== 'via') continue;
    const m = p.signal.match(/^net_(\d+)$/);
    const net = m ? parseInt(m[1], 10) + 1 : 0;
    body += `  (via (at ${k(p.x)} ${k(-p.y)}) (size ${k(p.diameter)}) (drill ${k(p.drill)}) (layers "F.Cu" "B.Cu") (net ${net}))` + NL;
  }

  // reinforcement outline, curved segments sampled to a polyline
  for (const p of primitives) {
    if (p.type !== 'polygon' || p.layer !== reinforcement_layer_number) continue;
    const pts = [];
    for (let i = 0; i < p.points.length - 1; i++) {
      const a = p.points[i], b = p.points[i + 1];
      pts.push([a.x, a.y]);
      if (a.curve) {
        const g = solve_poly_arc(a.x, a.y, b.x, b.y, a.curve);
        if (g) {
          const sweep = g.ccw ? mod2pi(g.a2 - g.a1) : -mod2pi(g.a1 - g.a2);
          for (let s = 1; s < 24; s++) {
            const ang = g.a1 + sweep * s / 24;
            pts.push([g.cx + g.r * Math.cos(ang), g.cy + g.r * Math.sin(ang)]);
          }
        }
      }
    }
    const xy = pts.map(q => `(xy ${k(q[0])} ${k(-q[1])})`).join(' ');
    body += `  (gr_poly (pts ${xy}) (layer "F.Adhes") (width ${k(p.width)}) (fill none))` + NL;
  }

  let nets = '  (net 0 "")' + NL;
  for (let i = 0; i < track_widths.length; i++)
    nets += `  (net ${i + 1} "net_${i}")` + NL;

  return `(kicad_pcb (version 20211014) (generator "ffsc-generator")
  (general (thickness 0.2))
  (paper "A4")
  (layers
    (0 "F.Cu" signal)
    (31 "B.Cu" signal)
    (32 "B.Adhes" user "B.Adhesive")
    (33 "F.Adhes" user "F.Adhesive")
    (34 "B.Paste" user)
    (35 "F.Paste" user)
    (36 "B.SilkS" user "B.Silkscreen")
    (37 "F.SilkS" user "F.Silkscreen")
    (38 "B.Mask" user)
    (39 "F.Mask" user)
    (40 "Dwgs.User" user "User.Drawings")
    (41 "Cmts.User" user "User.Comments")
    (44 "Edge.Cuts" user)
    (45 "Margin" user)
    (46 "B.CrtYd" user "B.Courtyard")
    (47 "F.CrtYd" user "F.Courtyard")
    (48 "B.Fab" user)
    (49 "F.Fab" user)
  )
  (setup (pad_to_mask_clearance 0))
${nets}${body})
`;
}

/* --------------------------- undo / autosave --------------------------- */
const undoState = { stack: [], redo: [], limit: 60, suspend: false };

function snapshot_state() {
  if (undoState.suspend) return;
  const snap = JSON.stringify(state);
  if (undoState.stack[undoState.stack.length - 1] === snap) return;
  undoState.stack.push(snap);
  if (undoState.stack.length > undoState.limit) undoState.stack.shift();
  undoState.redo.length = 0;
  try { localStorage.setItem('ffsc-autosave', snap); } catch (e) { /* storage unavailable */ }
}

function apply_snapshot(snap) {
  undoState.suspend = true;
  Object.assign(state, JSON.parse(snap));
  refreshPanelValues();
  regenerate();
  undoState.suspend = false;
  updateUndoButtons();
}

function do_undo() {
  if (undoState.stack.length < 2) return;
  undoState.redo.push(undoState.stack.pop());
  apply_snapshot(undoState.stack[undoState.stack.length - 1]);
}

function do_redo() {
  if (!undoState.redo.length) return;
  const next = undoState.redo.pop();
  undoState.stack.push(next);
  apply_snapshot(next);
}

function updateUndoButtons() {
  const u = document.getElementById('undo-btn'), r = document.getElementById('redo-btn');
  if (u) u.disabled = undoState.stack.length < 2;
  if (r) r.disabled = !undoState.redo.length;
}

/* -------------------------- SVG etch artwork --------------------------- */
/* True-scale SVG (1 user unit = 1 mm). Arcs are sampled to polylines at
   ~0.05 mm chord error, which is far below etching resolution. */
function sample_world_arc(g, step_mm = 0.05) {
  const sweep = g.ccw ? mod2pi(g.a2 - g.a1) : -mod2pi(g.a1 - g.a2);
  const steps = Math.max(8, Math.ceil(Math.abs(sweep) * g.r / step_mm));
  const pts = [];
  for (let s = 0; s <= steps; s++) {
    const a = g.a1 + sweep * (s / steps);
    pts.push([g.cx + g.r * Math.cos(a), g.cy + g.r * Math.sin(a)]);
  }
  return pts;
}

function build_svg(opts) {
  const margin = 2;
  const ext = { minX: Infinity, minY: Infinity, maxX: -Infinity, maxY: -Infinity };
  for (const p of primitives)
    if (p.layer === top_layer_number || p.layer === outline_layer_number || p.type === 'via')
      primBounds(p, ext);
  if (ext.minX === Infinity) return '<svg xmlns="http://www.w3.org/2000/svg"/>';

  const W = ext.maxX - ext.minX + 2 * margin;
  const H = ext.maxY - ext.minY + 2 * margin;
  const f = v => Math.round(v * 1000) / 1000;
  const X = x => f((opts.mirror ? ext.maxX - x : x - ext.minX) + margin);
  const Y = y => f((ext.maxY - y) + margin);

  let body = '';
  if (opts.background)
    body += `<rect x="0" y="0" width="${f(W)}" height="${f(H)}" fill="#ffffff"/>\n`;

  const polyline = (pts, width, color) =>
    `<polyline points="${pts.map(q => X(q[0]) + ',' + Y(q[1])).join(' ')}" fill="none" stroke="${color}" stroke-width="${f(width)}" stroke-linecap="round" stroke-linejoin="round"/>\n`;

  const polygon_pts = p => {
    const pts = [];
    for (let i = 0; i < p.points.length - 1; i++) {
      const a = p.points[i], b = p.points[i + 1];
      pts.push([a.x, a.y]);
      if (a.curve) {
        const g = solve_poly_arc(a.x, a.y, b.x, b.y, a.curve);
        if (g) pts.push(...sample_world_arc(g).slice(1, -1));
      }
    }
    return pts;
  };

  if (opts.copper) {
    for (const p of primitives) {
      if (p.layer !== top_layer_number) continue;
      if (p.type === 'wire') body += polyline([[p.x1, p.y1], [p.x2, p.y2]], p.width, '#000000');
      else if (p.type === 'arc') {
        const g = eagleArcGeometry(p);
        if (g) body += polyline(sample_world_arc(g), p.width, '#000000');
      } else if (p.type === 'polygon') {
        body += `<polygon points="${polygon_pts(p).map(q => X(q[0]) + ',' + Y(q[1])).join(' ')}" fill="#000000" stroke="#000000" stroke-width="${f(p.width)}" stroke-linejoin="round"/>\n`;
      }
    }
  }

  if (opts.outline) {
    for (const p of primitives) {
      if (p.layer !== outline_layer_number) continue;
      if (p.type === 'wire') body += polyline([[p.x1, p.y1], [p.x2, p.y2]], p.width, opts.copper ? '#666666' : '#000000');
      else if (p.type === 'fillet') body += polyline(sample_world_arc(p), p.width, opts.copper ? '#666666' : '#000000');
      else if (p.type === 'arc') {
        const g = eagleArcGeometry(p);
        if (g) body += polyline(sample_world_arc(g), p.width, opts.copper ? '#666666' : '#000000');
      }
    }
  }

  if (opts.drills)
    for (const p of primitives)
      if (p.type === 'via')
        body += `<circle cx="${X(p.x)}" cy="${Y(p.y)}" r="${f(p.drill / 2)}" fill="#ffffff"/>\n`;

  return `<svg xmlns="http://www.w3.org/2000/svg" width="${f(W)}mm" height="${f(H)}mm" viewBox="0 0 ${f(W)} ${f(H)}">\n${body}</svg>\n`;
}

function open_print_view() {
  const svg = build_svg({ mirror: false, copper: true, outline: true, drills: true, background: false });
  const w = window.open('', '_blank');
  if (!w) return;
  w.document.write(`<!DOCTYPE html><html><head><title>FFSC 1:1 print - ${export_base()}</title><style>
    body { font-family: -apple-system, sans-serif; margin: 10mm; }
    .cal { width: 50mm; height: 5mm; border: 0.3mm solid #000; border-top: none; margin-top: 4mm; }
    .note { font-size: 9pt; color: #444; }
    svg { display: block; margin-top: 6mm; }
    @media print { .noprint { display: none; } }
  </style></head><body>
    <div class="noprint">
      <p>Print at <b>100% scale</b> - disable any "fit to page" option. The bar below must measure exactly 50&nbsp;mm.</p>
      <button onclick="print()">Print</button>
    </div>
    <div class="cal"></div>
    <div class="note">50 mm calibration bar &middot; ${export_base()}</div>
    ${svg}
  </body></html>`);
  w.document.close();
}

/* ---------------------------- URL sharing ----------------------------- */
function encode_share_hash() {
  const payload = { p: state, e: { t: electrical.thickness_um, dT: electrical.deltaT } };
  const s = btoa(JSON.stringify(payload)).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
  history.replaceState(null, '', '#d=' + s);
}

function decode_share_hash() {
  if (!location.hash.startsWith('#d=')) return null;
  try {
    const s = location.hash.slice(3).replace(/-/g, '+').replace(/_/g, '/');
    const payload = JSON.parse(atob(s));
    return payload && payload.p ? payload : null;
  } catch (e) {
    return null;
  }
}

function copy_share_link(btn) {
  encode_share_hash();
  const done = () => {
    const prev = btn.textContent;
    btn.textContent = 'Copied ✓';
    setTimeout(() => { btn.textContent = prev; }, 1500);
  };
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(location.href).then(done, () => fallbackCopy(done));
  } else {
    fallbackCopy(done);
  }
  function fallbackCopy(cb) {
    const ta = document.createElement('textarea');
    ta.value = location.href;
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    ta.remove();
    cb();
  }
}

/* which primitives a focused parameter row highlights; everything else dims */
let focusTag = null;

function setFocusTag(tag) {
  if (focusTag !== tag) {
    focusTag = tag;
    render();
  }
}

function focus_match(tag, p) {
  switch (tag) {
    case 'straights': return p.type === 'wire' && (p.layer === top_layer_number || p.layer === outline_layer_number);
    case 'bends': return p.type === 'arc';
    case 'traces': return (p.type === 'wire' || p.type === 'arc') && p.layer === top_layer_number;
    case 'copper-wires': return p.type === 'wire' && p.layer === top_layer_number;
    case 'outline': return p.layer === outline_layer_number;
    case 'pads': return p.type === 'polygon' && p.layer === top_layer_number;
    case 'vias': return p.type === 'via';
    case 'reinforcement': return p.type === 'polygon' && p.layer === reinforcement_layer_number;
    case 'polygons': return p.type === 'polygon';
    case 'fillet-corner': return p.type === 'fillet' && Math.abs(p.r - state.outline_corner_radius) < 1e-6;
    case 'fillet-angle': return p.type === 'fillet' && Math.abs(p.r - state.outline_angle_radius) < 1e-6;
  }
  return true;
}

const FOCUS_DIM = 0.35;
let isolate_on_hover = true;

function alphaFor(p) {
  return focusTag && !focus_match(focusTag, p) ? FOCUS_DIM : 1;
}

function buildPanel() {
  const controls = document.getElementById('controls');
  controls.innerHTML = '';

  // view aid: isolate the hovered/edited parameter's geometry
  const fsView = document.createElement('fieldset');
  const isoRow = document.createElement('div');
  isoRow.className = 'row';
  const isoLabel = document.createElement('label');
  isoLabel.textContent = 'Isolate feature on hover';
  isoLabel.title = 'While hovering or editing a parameter below, fade out everything except the geometry it affects.';
  const isoCb = document.createElement('input');
  isoCb.type = 'checkbox';
  isoCb.checked = isolate_on_hover;
  isoCb.id = 'in_isolate_on_hover';
  isoLabel.htmlFor = isoCb.id;
  isoCb.addEventListener('change', () => {
    isolate_on_hover = isoCb.checked;
    if (!isolate_on_hover) setFocusTag(null);
  });
  isoRow.append(isoLabel, isoCb);
  fsView.appendChild(isoRow);
  controls.appendChild(fsView);

  for (const group of GROUPS) buildGroup(group);
  rebuildSegmentTable();

  function buildGroup(group) {
    const fs = document.createElement('fieldset');
    const lg = document.createElement('legend');
    lg.textContent = group.name;
    fs.appendChild(lg);

    for (const item of group.items) {
      const row = document.createElement('div');
      row.className = 'row' + (item.type === 'array' ? ' wide' : '');
      const label = document.createElement('label');
      label.textContent = item.label;
      label.title = item.tip || '';
      label.htmlFor = 'in_' + item.key;
      row.appendChild(label);

      let input;
      if (item.type === 'bool') {
        input = document.createElement('input');
        input.type = 'checkbox';
        input.checked = state[item.key];
        input.addEventListener('change', () => { state[item.key] = input.checked; regenerate(); });
      } else if (item.type === 'array') {
        input = document.createElement('input');
        input.type = 'text';
        input.spellcheck = false;
        input.value = state[item.key].join(', ');
        input.addEventListener('input', () => {
          const parsed = input.value.split(/[\s,;]+/).filter(s => s.length).map(Number);
          if (parsed.length === 0 || parsed.some(n => !isFinite(n))) { input.classList.add('bad'); return; }
          input.classList.remove('bad');
          state[item.key] = parsed;
          regenerate();
        });
      } else {
        input = document.createElement('input');
        input.type = 'number';
        input.step = item.step ?? 0.1;
        if (item.min !== undefined) input.min = item.min;
        input.value = state[item.key];
        input.addEventListener('input', () => {
          const v = item.int ? parseInt(input.value, 10) : parseFloat(input.value);
          if (!isFinite(v)) { input.classList.add('bad'); return; }
          input.classList.remove('bad');
          state[item.key] = v;
          regenerate();
        });
      }
      input.id = 'in_' + item.key;
      row.appendChild(input);
      fs.appendChild(row);

      if (item.focus) {
        row.addEventListener('mouseenter', () => { if (isolate_on_hover) setFocusTag(item.focus); });
        row.addEventListener('mouseleave', () => { if (document.activeElement !== input) setFocusTag(null); });
        input.addEventListener('focus', () => { if (isolate_on_hover) setFocusTag(item.focus); });
        input.addEventListener('blur', () => setFocusTag(null));
      }
    }

    if (group.name === 'Segments') {
      const wrap = document.createElement('div');
      wrap.id = 'segment-table-wrap';
      fs.appendChild(wrap);
      const note = document.createElement('div');
      note.className = 'mini-note';
      note.textContent = 'Angle and radius describe the bend after each segment. First and last segments are the pad ends.';
      fs.appendChild(note);

      const br = document.createElement('div');
      br.className = 'btn-row';
      const add = document.createElement('button');
      add.textContent = '+ Segment';
      add.addEventListener('click', () => {
        state.segment_length.push(10);
        state.segment_angle.push(0);
        state.segment_inner_radius.push(2);
        refreshPanelValues();
        regenerate();
      });
      const rem = document.createElement('button');
      rem.textContent = '− Segment';
      rem.addEventListener('click', () => {
        if (state.segment_length.length <= 1) return;
        state.segment_length.pop();
        state.segment_angle.pop();
        state.segment_inner_radius.pop();
        refreshPanelValues();
        regenerate();
      });
      br.append(add, rem);
      fs.appendChild(br);
    }

    if (group.name === 'Tracks') {
      const br = document.createElement('div');
      br.className = 'btn-row';
      const add = document.createElement('button');
      add.textContent = '+ Track';
      add.addEventListener('click', () => {
        state.track_widths.push(state.track_widths[state.track_widths.length - 1] || 0.5);
        refreshPanelValues();
        regenerate();
      });
      const rem = document.createElement('button');
      rem.textContent = '− Track';
      rem.addEventListener('click', () => {
        if (state.track_widths.length <= 2) return;
        state.track_widths.pop();
        refreshPanelValues();
        regenerate();
      });
      br.append(add, rem);
      fs.insertBefore(br, fs.children[2] || null);   // right below the track widths row
    }

    controls.appendChild(fs);
  }
}

    const fs = document.createElement('fieldset');
    const lg = document.createElement('legend');
    lg.textContent = title;
    fs.appendChild(lg);
    root.appendChild(fs);
    return fs;
  };
  let rowId = 0;
  const row = (fs, labelText, input, tip) => {
    const r = document.createElement('div');
    r.className = 'row';
    const l = document.createElement('label');
    l.textContent = labelText;
    if (tip) l.title = tip;
    input.id = 'ap_' + (rowId++);
    l.htmlFor = input.id;
    r.appendChild(l);
    r.appendChild(input);
    fs.appendChild(r);
    return r;
  };
  const checkbox = (checked, onchange) => {
    const cb = document.createElement('input');
    cb.type = 'checkbox';
    cb.checked = checked;
    cb.addEventListener('change', () => onchange(cb.checked));
    return cb;
  };

  // colour scheme
  const fsScheme = fieldset('Colour scheme');
  const sel = document.createElement('select');
  sel.id = 'ap_scheme';
  sel.setAttribute('aria-label', 'Colour scheme');
  sel.style.width = '100%';
  for (const [key, s] of Object.entries(SCHEMES)) {
    const opt = document.createElement('option');
    opt.value = key;
    opt.textContent = s.label;
    sel.appendChild(opt);
  }
  sel.value = appearance.scheme;
  sel.addEventListener('change', () => {
    appearance.scheme = sel.value;
    Object.assign(appearance, SCHEMES[sel.value].defaults);
    buildAppearancePanel();      // refresh dependent checkboxes
    render();
  });
  fsScheme.appendChild(sel);

  // fills
  const fsFill = fieldset('Fills');
  row(fsFill, 'Fill board (kapton)', checkbox(appearance.fillBoard, v => { appearance.fillBoard = v; render(); }),
      'Fill the area inside the board outline as the kapton substrate.');
  row(fsFill, 'Fill reinforcement', checkbox(appearance.fillReinforcement, v => { appearance.fillReinforcement = v; render(); }),
      'Fill the reinforcement overlay instead of drawing it as a dashed outline.');

  // dashed line density
  const fsDash = fieldset('Dashed lines');
  const dash = document.createElement('input');
  dash.type = 'number';
  dash.min = 2; dash.max = 40; dash.step = 1;
  dash.value = appearance.dashGap;
  dash.addEventListener('input', () => {
    const v = parseInt(dash.value, 10);
    if (isFinite(v) && v >= 2) { appearance.dashGap = v; render(); }
  });
  row(fsDash, 'Dash spacing (px)', dash, 'Gap between dashes on unpoured (dashed) outlines.');

  // layer visibility
  const fsLayers = fieldset('Layers');
  const wrap = document.createElement('div');
  wrap.className = 'toggles';
  const S = schemeNow();
  const layers = [
    ['copper', 'Copper', S.copper], ['outline', 'Outline', S.outline],
    ['reinforcement', 'Reinforcement', S.reinforcement], ['vias', 'Vias', S.via],
  ];
  for (const [key, name, color] of layers) {
    const l = document.createElement('label');
    const cb = checkbox(appearance.layers[key], v => { appearance.layers[key] = v; render(); });
    l.appendChild(cb);
    const sw = document.createElement('span');
    sw.className = 'swatch';
    sw.style.background = color;
    l.appendChild(sw);
    l.appendChild(document.createTextNode(name));
    wrap.appendChild(l);
  }
  fsLayers.appendChild(wrap);
}

/* ------------------------------ tracks tab ---------------------------- */
function buildTracksPanel() {
  const root = document.getElementById('tracks-controls');
  root.innerHTML = '';

  const fsCu = document.createElement('fieldset');
  fsCu.innerHTML = '<legend>Copper</legend>';
  const numRow = (labelText, value, step, min, tip, onchange) => {
    const r = document.createElement('div');
    r.className = 'row';
    const l = document.createElement('label');
    l.textContent = labelText;
    l.title = tip;
    const inp = document.createElement('input');
    inp.type = 'number';
    inp.step = step; inp.min = min; inp.value = value;
    inp.id = 'tr_' + labelText.replace(/\W+/g, '_');
    l.htmlFor = inp.id;
    inp.addEventListener('input', () => {
      const v = parseFloat(inp.value);
      if (isFinite(v) && v >= parseFloat(inp.min || 0)) { onchange(v); renderTracksTab(); }
    });
    r.append(l, inp);
    return r;
  };
  fsCu.append(
    numRow('Copper thickness (µm)', electrical.thickness_um, 1, 5, '35 µm = 1 oz, 18 µm = 0.5 oz', v => { electrical.thickness_um = v; }),
    numRow('Temperature rise (°C)', electrical.deltaT, 1, 1, 'Allowed self-heating for the current capacity estimate (IPC-2221)', v => { electrical.deltaT = v; }),
  );

  const fsSolver = document.createElement('fieldset');
  fsSolver.innerHTML = '<legend>Constraint solver</legend>';
  fsSolver.append(
    numRow('Required current (A)', electrical.reqCurrent || '', 0.1, 0, 'The current the selected tracks must carry', v => { electrical.reqCurrent = v; }),
    numRow('Max voltage drop (mV)', electrical.maxDropMV || '', 10, 0, 'Maximum end-to-end voltage drop at the required current', v => { electrical.maxDropMV = v; }),
  );
  const solverOut = document.createElement('div');
  solverOut.className = 'mini-note';
  solverOut.id = 'solver-out';
  const applyRow = document.createElement('div');
  applyRow.className = 'btn-row';
  const applyBtn = document.createElement('button');
  applyBtn.id = 'solver-apply';
  applyBtn.textContent = 'Apply width to selected';
  applyBtn.addEventListener('click', () => {
    if (!(electrical.reqCurrent > 0) || selectedTracks.size === 0) return;
    // widening tracks grows the board and lengthens every track, which raises
    // the voltage drop again - iterate until widths and geometry agree
    for (let pass = 0; pass < 10; pass++) {
      let changed = false;
      for (const i of selectedTracks) {
        const w = Number(required_width(i).toFixed(2));
        if (Math.abs(w - state.track_widths[i]) > 0.001) { state.track_widths[i] = w; changed = true; }
      }
      if (!changed) break;
      apply_params(state);
      primitives = []; miters = []; current_polygon = null;
      scr_lines = []; track_lengths = [];
      override_inter_track_spacing_angle = 0;
      try { output_eagle_script(); } catch (e) { break; }
    }
    refreshPanelValues();
    regenerate();
  });
  applyRow.appendChild(applyBtn);
  fsSolver.append(solverOut, applyRow);

  const fsTable = document.createElement('fieldset');
  fsTable.innerHTML = '<legend>Tracks</legend>';
  const selRow = document.createElement('div');
  selRow.className = 'btn-row';
  const selAll = document.createElement('button');
  selAll.textContent = 'Select all';
  selAll.addEventListener('click', () => {
    for (let i = 0; i < state.track_widths.length; i++) selectedTracks.add(i);
    render(); renderTracksTab();
  });
  const selNone = document.createElement('button');
  selNone.textContent = 'Select none';
  selNone.addEventListener('click', () => { selectedTracks.clear(); render(); renderTracksTab(); });
  selRow.append(selAll, selNone);
  const tableWrap = document.createElement('div');
  tableWrap.id = 'tracks-table';
  const note = document.createElement('div');
  note.className = 'mini-note';
  note.textContent = 'R and ΔV use total routed copper length; Imax is the IPC-2221 external-conductor estimate at the temperature rise above. Click rows (or tracks on the canvas) to select.';
  fsTable.append(selRow, tableWrap, note);

  root.append(fsCu, fsSolver, fsTable);
  renderTracksTab();
}

function renderTracksTab() {
  const wrap = document.getElementById('tracks-table');
  if (!wrap) return;

  const I = electrical.reqCurrent;
  let html = '<table class="tracks"><thead><tr><th>#</th><th>w mm</th><th>L mm</th><th>R mΩ</th><th>Imax A</th>';
  if (I > 0) html += '<th>ΔV mV</th>';
  html += '</tr></thead><tbody>';
  for (let i = 0; i < state.track_widths.length; i++) {
    const w = state.track_widths[i];
    const L = track_lengths[i] || 0;
    const R = track_resistance(i);
    const imax = track_imax(w);
    const drop = I > 0 ? I * R * 1000 : 0;
    const violates = I > 0 && (imax < I || (electrical.maxDropMV > 0 && drop > electrical.maxDropMV));
    const cls = (selectedTracks.has(i) ? 'sel' : '') + (violates && selectedTracks.has(i) ? ' viol' : violates ? ' viol' : '');
    html += `<tr data-i="${i}" class="${cls.trim()}"><td>${i}</td><td>${w.toFixed(2)}</td><td>${L.toFixed(1)}</td><td>${(R * 1000).toFixed(1)}</td><td>${imax.toFixed(2)}</td>`;
    if (I > 0) html += `<td>${drop.toFixed(1)}</td>`;
    html += '</tr>';
  }
  html += '</tbody></table>';
  wrap.innerHTML = html;
  for (const tr of wrap.querySelectorAll('tbody tr')) {
    tr.addEventListener('click', () => {
      const i = parseInt(tr.dataset.i, 10);
      if (selectedTracks.has(i)) selectedTracks.delete(i); else selectedTracks.add(i);
      render();
      renderTracksTab();
    });
  }

  const out = document.getElementById('solver-out');
  const applyBtn = document.getElementById('solver-apply');
  if (out && applyBtn) {
    if (!(I > 0)) {
      out.textContent = 'Enter a required current (and optionally a max voltage drop), select tracks, then apply.';
      applyBtn.disabled = true;
    } else if (selectedTracks.size === 0) {
      out.textContent = `Width for ${I} A self-heating limit: ${width_for_current(I).toFixed(2)} mm. Select tracks to apply.`;
      applyBtn.disabled = true;
    } else {
      const widths = [...selectedTracks].map(i => required_width(i));
      const lo = Math.min(...widths), hi = Math.max(...widths);
      out.textContent = `Required width for ${selectedTracks.size} selected track(s): ` +
        (hi - lo < 0.001 ? `${hi.toFixed(2)} mm` : `${lo.toFixed(2)} – ${hi.toFixed(2)} mm (per-track, drop depends on length)`);
      applyBtn.disabled = false;
    }
  }
}

/* -------------------------------- DRC --------------------------------- */
/* Geometric feasibility checks the original generator never did - it would
   silently emit broken geometry. Estimates reuse the generator's own maths,
   ignoring the symmetry redistribution, so taper figures are approximate. */
const drc = { enabled: true, findings: [], minTrack: 0.15, minClearance: 0.15 };

function dist_point_segment(px, py, x1, y1, x2, y2) {
  const dx = x2 - x1, dy = y2 - y1;
  const len2 = dx * dx + dy * dy;
  const t = len2 ? Math.max(0, Math.min(1, ((px - x1) * dx + (py - y1) * dy) / len2)) : 0;
  return Math.hypot(px - (x1 + t * dx), py - (y1 + t * dy));
}

/* lowest y (segment-local) that any track's taper reaches in an end segment;
   negative means the taper needs more room than the segment provides and the
   generator will fold the tracks back on themselves */
function taper_min_meet(seg) {
  let closest;
  for (let cn = 0; cn < track_widths.length; cn++)
    if (calc_track_centre_x(cn) > calc_pad_coordinates(0, cn)[4]) closest = cn;
  if (closest === undefined) return null;

  const overshoot = find_max_overshoot(seg, closest);
  let minMeet = Infinity, worstCn = 0;
  for (let cn = 0; cn < track_widths.length; cn++) {
    const track_centre_x = calc_track_centre_x(cn);
    const m = (track_centre_x < calc_pad_coordinates(seg, cn)[4]) ? gradient_of_taper : -gradient_of_taper;
    const centre = (cn <= closest) ? closest : closest + 1;
    const meet = calc_meeting_y(seg, cn, centre, m, track_centre_x, 0, overshoot)[2];
    if (meet < minMeet) { minMeet = meet; worstCn = cn; }
  }
  return { minMeet, worstCn };
}

function fix_taper_overrun(seg) {
  // meets shift up 1:1 with segment length, but iterate for safety;
  // target >= 1 mm of straight track so the fix also clears the warning
  for (let pass = 0; pass < 8; pass++) {
    apply_params(state);
    const r = taper_min_meet(seg);
    if (!r || r.minMeet >= 1) break;
    state.segment_length[seg] = Math.ceil((state.segment_length[seg] - r.minMeet + 1.5) * 2) / 2;
  }
  refreshPanelValues();
  regenerate();
}

/* worst clearance between copper wires and pads of other nets, measured
   on the generated primitives (negative = overlap / short) */
function worst_pad_clearance() {
  const pads = primitives.filter(p => p.type === 'polygon' && p.layer === top_layer_number);
  const wires = primitives.filter(p => p.type === 'wire' && p.layer === top_layer_number);
  const segDist = (a1, a2, b1, b2) => Math.min(
    dist_point_segment(a1[0], a1[1], b1[0], b1[1], b2[0], b2[1]),
    dist_point_segment(a2[0], a2[1], b1[0], b1[1], b2[0], b2[1]),
    dist_point_segment(b1[0], b1[1], a1[0], a1[1], a2[0], a2[1]),
    dist_point_segment(b2[0], b2[1], a1[0], a1[1], a2[0], a2[1]));
  let worst = { clear: Infinity };
  for (const w of wires) {
    for (const pad of pads) {
      if (pad.net === w.net) continue;
      for (let i = 0; i < pad.points.length - 1; i++) {
        const e1 = pad.points[i], e2 = pad.points[i + 1];
        const dist = segDist([w.x1, w.y1], [w.x2, w.y2], [e1.x, e1.y], [e2.x, e2.y]);
        const clear = dist - w.width / 2 - pad.width / 2;
        if (clear < worst.clear)
          worst = { clear, wireNet: w.net, padNet: pad.net, x: (w.x1 + w.x2) / 2, y: (w.y1 + w.y2) / 2 };
      }
    }
  }
  return worst;
}

/* raise additional_track_from_pad_length towards 0 until the pad clearance
   is met (or it reaches 0 - any remaining violation has another cause) */
function fix_track_from_pad() {
  for (let pass = 0; pass < 40 && state.additional_track_from_pad_length < 0; pass++) {
    apply_params(state);
    primitives = []; miters = []; current_polygon = null;
    scr_lines = []; track_lengths = [];
    override_inter_track_spacing_angle = 0;
    try { output_eagle_script(); } catch (e) { break; }
    if (worst_pad_clearance().clear >= drc.minClearance) break;
    state.additional_track_from_pad_length = Math.min(0,
      Math.round((state.additional_track_from_pad_length + 0.25) * 100) / 100);
  }
  refreshPanelValues();
  regenerate();
}

function run_drc() {
  const findings = [];
  const n = track_widths.length;
  const err = (msg, loc, fix) => findings.push({ level: 'err', msg, loc, fix });
  const warn = (msg, loc, fix) => findings.push({ level: 'warn', msg, loc, fix });

  const pad_length = pad_length_to_max_track_ratio * (pad_width_to_track_ratio * Math.max(...track_widths));
  const ends = [0, segment_length.length - 1];

  const pad_loc = (seg, i) => {
    const c = calc_pad_coordinates(seg, i);
    return calc_new_point(seg, c[4], (c[1] + c[3]) / 2);
  };

  // vias must fit their pads
  for (let i = 0; i < n; i++) {
    const pw = calc_pad_width(i);
    const drill = Math.min(preferred_via_drill_size, pw - 2 * via_annular_ring - 2 * minimum_via_to_pad_edge);
    if (drill <= 0)
      err(`Track ${i}: pad (${pw.toFixed(2)} mm) too narrow for a via - drill would be ${drill.toFixed(2)} mm`, pad_loc(0, i));
    else if (drill < 0.1 - 1e-9)
      warn(`Track ${i}: via drill shrinks to ${drill.toFixed(2)} mm - check your fab's minimum drill`, pad_loc(0, i));
    if (track_widths[i] > pw + 1e-9)
      warn(`Track ${i} (${track_widths[i]} mm) is wider than its pad (${pw.toFixed(2)} mm)`, pad_loc(0, i));
  }

  // find the taper crossover (same scan as draw_end)
  let closest;
  for (let cn = 0; cn < n; cn++)
    if (calc_track_centre_x(cn) > calc_pad_coordinates(0, cn)[4]) closest = cn;

  for (const seg of ends) {
    // pads must fit in the end segment
    if (pad_length > segment_length[seg])
      err(`End segment ${seg}: pads (${pad_length.toFixed(1)} mm) are longer than the segment (${segment_length[seg]} mm)`, calc_new_point(seg, 0, segment_length[seg] / 2),
        { label: 'Lengthen segment', apply: () => fix_taper_overrun(seg) });

    // the taper must complete before the end of the segment - if it can't,
    // the generator folds the tracks back on themselves
    const r = taper_min_meet(seg);
    if (r) {
      if (r.minMeet < 0)
        err(`End segment ${seg}: taper overruns the segment by ~${(-r.minMeet).toFixed(1)} mm - the tracks fold back on themselves`, calc_new_point(seg, calc_track_centre_x(r.worstCn), 0),
          { label: 'Lengthen segment', apply: () => fix_taper_overrun(seg) });
      else if (r.minMeet < 1)
        warn(`End segment ${seg}: only ~${r.minMeet.toFixed(1)} mm of straight track after the taper`, calc_new_point(seg, calc_track_centre_x(r.worstCn), 0),
          { label: 'Lengthen segment', apply: () => fix_taper_overrun(seg) });
    }

    // reinforcement stress-relief triangles should stay inside the end segment
    if (taper_distance_from_edge + triangle_height > segment_length[seg])
      warn(`End segment ${seg}: reinforcement triangles extend ${(taper_distance_from_edge + triangle_height - segment_length[seg]).toFixed(1)} mm past the segment`, calc_new_point(seg, 0, segment_length[seg] - taper_distance_from_edge - triangle_height),
        { label: 'Shrink triangles', apply: () => {
          const minLen = Math.min(state.segment_length[0], state.segment_length[state.segment_length.length - 1]);
          if (state.taper_distance_from_edge > minLen - 1)
            state.taper_distance_from_edge = Math.max(0.5, Math.floor((minLen - 1) * 10) / 10);
          state.triangle_height = Math.max(0.5, Math.floor((minLen - state.taper_distance_from_edge) * 10) / 10);
          refreshPanelValues();
          regenerate();
        } });
  }

  // bends: the inner edge must clear the copper and leave room for the outline
  for (let a = 0; a < segment_angle.length; a++) {
    if (segment_angle[a] === 0) continue;
    const innerTrack = segment_angle[a] < 0 ? 0 : n - 1;
    const w = track_widths[innerTrack];
    const loc = calc_abs_segment_origin_recursive(a + 1, a);
    const needed = Math.ceil((track_to_edge_spacing + w / 2 + 0.1) * 10) / 10;
    const fixBend = { label: 'Increase radius', apply: () => {
      state.segment_inner_radius[a] = needed;
      refreshPanelValues();
      regenerate();
    } };
    if (segment_inner_radius[a] < w / 2)
      err(`Bend ${a}: inner radius ${segment_inner_radius[a]} mm is smaller than half the inner track width (${(w / 2).toFixed(2)} mm) - copper self-intersects`, loc, fixBend);
    else if (segment_inner_radius[a] < track_to_edge_spacing + w / 2)
      warn(`Bend ${a}: inner radius ${segment_inner_radius[a]} mm leaves no room for the board edge (needs > ${(track_to_edge_spacing + w / 2).toFixed(2)} mm)`, loc, fixBend);
  }

  // manufacturing limits
  const thin = [];
  for (let i = 0; i < n; i++)
    if (track_widths[i] < drc.minTrack - 1e-9) thin.push(i);
  if (thin.length)
    warn(`${thin.length} track(s) narrower than the ${drc.minTrack} mm minimum width (track${thin.length > 1 ? 's' : ''} ${thin.join(', ')})`);
  if (inter_track_spacing_straight < drc.minClearance - 1e-9)
    warn(`Straight track spacing ${inter_track_spacing_straight} mm is below the ${drc.minClearance} mm minimum clearance`);
  if (inter_track_spacing_angle < drc.minClearance - 1e-9)
    warn(`Taper track spacing ${inter_track_spacing_angle} mm is below the ${drc.minClearance} mm minimum clearance`);
  if (inter_pad_spacing < drc.minClearance - 1e-9)
    warn(`Pad spacing ${inter_pad_spacing} mm is below the ${drc.minClearance} mm minimum clearance`);

  // copper tracks passing too close to pads of other nets - measured on the
  // generated geometry itself, so this is exact (unlike the taper estimate).
  // A common cause is a too-negative track-from-pad value, which pulls the
  // taper start up between (and eventually across) the pads - offer raising
  // it as the fix when it is negative.
  {
    const worst = worst_pad_clearance();
    const fixPad = state.additional_track_from_pad_length < 0
      ? { label: 'Raise track-from-pad', apply: fix_track_from_pad }
      : undefined;
    if (worst.clear < 0)
      err(`Track ${worst.wireNet} crosses pad ${worst.padNet} by ${(-worst.clear).toFixed(2)} mm - short circuit`, [worst.x, worst.y], fixPad);
    else if (worst.clear < drc.minClearance - 1e-9)
      warn(`Track ${worst.wireNet} passes ${worst.clear.toFixed(2)} mm from pad ${worst.padNet} (min clearance ${drc.minClearance} mm)`, [worst.x, worst.y], fixPad);
  }

  // the outline should chain into a closed loop
  if (!build_outline_loop())
    warn('Board outline does not form a closed loop - check segment lengths and angles');

  // and it should not cross itself (folded-over board)
  const xing = outline_self_intersection();
  if (xing)
    err(`Board outline crosses itself near (${xing[0].toFixed(1)}, ${xing[1].toFixed(1)}) - segments fold over each other`, xing);

  return findings;
}

/* first proper crossing between two outline edges, or null. Arcs are
   sampled to polylines; edges sharing an endpoint (the normal chain
   joints) don't count. */
function outline_self_intersection() {
  const eps = 1e-3;
  const segs = [];
  let pid = 0;
  for (const p of primitives) {
    if (p.layer !== outline_layer_number) continue;
    pid++;
    if (p.type === 'wire') {
      if (Math.hypot(p.x2 - p.x1, p.y2 - p.y1) < eps) continue;
      segs.push({ pid, x1: p.x1, y1: p.y1, x2: p.x2, y2: p.y2 });
    } else {
      const g = p.type === 'fillet' ? p : eagleArcGeometry(p);
      if (!g) continue;
      const pts = sample_world_arc(g, 0.5);
      for (let i = 0; i < pts.length - 1; i++)
        segs.push({ pid, x1: pts[i][0], y1: pts[i][1], x2: pts[i + 1][0], y2: pts[i + 1][1] });
    }
  }

  const cross = (ax, ay, bx, by, cx, cy) => (bx - ax) * (cy - ay) - (by - ay) * (cx - ax);
  for (const s of segs) {
    s.minX = Math.min(s.x1, s.x2); s.maxX = Math.max(s.x1, s.x2);
    s.minY = Math.min(s.y1, s.y2); s.maxY = Math.max(s.y1, s.y2);
  }
  for (let i = 0; i < segs.length; i++) {
    const a = segs[i];
    for (let j = i + 1; j < segs.length; j++) {
      const b = segs[j];
      if (a.pid === b.pid) continue;
      if (a.maxX < b.minX || b.maxX < a.minX || a.maxY < b.minY || b.maxY < a.minY) continue;
      if (Math.hypot(a.x1 - b.x1, a.y1 - b.y1) < eps || Math.hypot(a.x1 - b.x2, a.y1 - b.y2) < eps ||
          Math.hypot(a.x2 - b.x1, a.y2 - b.y1) < eps || Math.hypot(a.x2 - b.x2, a.y2 - b.y2) < eps) continue;
      const d1 = cross(a.x1, a.y1, a.x2, a.y2, b.x1, b.y1);
      const d2 = cross(a.x1, a.y1, a.x2, a.y2, b.x2, b.y2);
      const d3 = cross(b.x1, b.y1, b.x2, b.y2, a.x1, a.y1);
      const d4 = cross(b.x1, b.y1, b.x2, b.y2, a.x2, a.y2);
      if ((d1 > 0) !== (d2 > 0) && (d3 > 0) !== (d4 > 0)) {
        const den = (a.x2 - a.x1) * (b.y2 - b.y1) - (a.y2 - a.y1) * (b.x2 - b.x1);
        const t = ((b.x1 - a.x1) * (b.y2 - b.y1) - (b.y1 - a.y1) * (b.x2 - b.x1)) / den;
        return [a.x1 + t * (a.x2 - a.x1), a.y1 + t * (a.y2 - a.y1)];
      }
    }
  }
  return null;
}

function renderDRC() {
  const tab = document.getElementById('tab-drc');
  drc.findings = drc.enabled ? run_drc() : [];

  const errs = drc.findings.filter(f => f.level === 'err').length;
  const warns = drc.findings.length - errs;
  tab.textContent = drc.enabled && drc.findings.length ? `DRC (${drc.findings.length})` : 'DRC';
  tab.classList.toggle('drc-err', drc.enabled && errs > 0);
  tab.classList.toggle('drc-warn', drc.enabled && errs === 0 && warns > 0);

  const list = document.getElementById('drc-list');
  if (!list) return;
  list.innerHTML = '';
  if (!drc.enabled) {
    list.innerHTML = '<div class="mini-note">Checks are disabled.</div>';
    return;
  }
  if (!drc.findings.length) {
    list.innerHTML = '<div class="drc-ok">✓ No issues found.</div>';
    return;
  }
  for (const f of drc.findings) {
    const row = document.createElement('div');
    row.className = 'drc-item ' + f.level + (f.loc ? ' loc' : '');
    const lvl = document.createElement('span');
    lvl.className = 'lvl';
    lvl.textContent = f.level === 'err' ? '✕' : '⚠';
    const msg = document.createElement('span');
    msg.textContent = f.msg;
    row.append(lvl, msg);
    if (f.fix) {
      const btn = document.createElement('button');
      btn.className = 'drc-fix';
      btn.textContent = f.fix.label;
      btn.addEventListener('click', e => { e.stopPropagation(); f.fix.apply(); });
      row.appendChild(btn);
    }
    if (f.loc) {
      row.title = 'Click to zoom to this location';
      row.addEventListener('click', () => {
        view.x = f.loc[0];
        view.y = f.loc[1];
        view.scale = Math.max(view.scale, 20);
        render();
      });
    }
    list.appendChild(row);
  }
}

function buildDRCPanel() {
  const root = document.getElementById('drc-controls');
  root.innerHTML = '';

  const fs = document.createElement('fieldset');
  fs.innerHTML = '<legend>Design rule checks</legend>';
  const row = document.createElement('div');
  row.className = 'row';
  const label = document.createElement('label');
  label.textContent = 'Enable checks';
  const cb = document.createElement('input');
  cb.type = 'checkbox';
  cb.checked = drc.enabled;
  cb.id = 'in_drc_enabled';
  label.htmlFor = cb.id;
  cb.addEventListener('change', () => { drc.enabled = cb.checked; renderDRC(); });
  row.append(label, cb);
  fs.appendChild(row);

  const limitRow = (labelText, key, tip) => {
    const r = document.createElement('div');
    r.className = 'row';
    const l = document.createElement('label');
    l.textContent = labelText;
    l.title = tip;
    const inp = document.createElement('input');
    inp.type = 'number';
    inp.step = 0.05; inp.min = 0.05;
    inp.value = drc[key];
    inp.id = 'in_drc_' + key;
    l.htmlFor = inp.id;
    inp.addEventListener('input', () => {
      const v = parseFloat(inp.value);
      if (isFinite(v) && v > 0) { drc[key] = v; renderDRC(); }
    });
    r.append(l, inp);
    fs.appendChild(r);
  };
  limitRow('Min track width (mm)', 'minTrack', 'Warn about tracks narrower than your process can make.');
  limitRow('Min clearance (mm)', 'minClearance', 'Warn about copper-to-copper gaps smaller than your process can etch.');

  const list = document.createElement('div');
  list.id = 'drc-list';
  fs.appendChild(list);

  const note = document.createElement('div');
  note.className = 'mini-note';
  note.textContent = 'Checks run on every change: via-in-pad fit, pad and taper fit within the end segments, bend radii vs copper and board edge, reinforcement overhang, and outline closure. Click a finding to zoom to it. Taper figures are estimates.';
  fs.appendChild(note);

  root.appendChild(fs);
}

// tab switching
const TABS = { design: 'controls', tracks: 'tracks-controls', drc: 'drc-controls', appearance: 'appearance-controls', export: 'export-controls' };
function showTab(which) {
  for (const [name, id] of Object.entries(TABS)) {
    document.getElementById(id).style.display = name === which ? '' : 'none';
    document.getElementById('tab-' + name).classList.toggle('active', name === which);
  }
}
for (const name of Object.keys(TABS))
  document.getElementById('tab-' + name).addEventListener('click', () => showTab(name));

function rebuildSegmentTable() {
  const wrap = document.getElementById('segment-table-wrap');
  if (!wrap) return;
  wrap.innerHTML = '';

  const table = document.createElement('table');
  table.className = 'tracks segs';
  table.innerHTML = '<thead><tr><th>#</th><th>Length</th><th>Bend °</th><th>Radius</th></tr></thead>';
  const tb = document.createElement('tbody');

  const cell = (tr, child) => {
    const td = document.createElement('td');
    if (child) td.appendChild(child); else td.textContent = '—';
    tr.appendChild(td);
    return td;
  };
  let segInputId = 0;
  const num = (value, step, tag, oncommit) => {
    const inp = document.createElement('input');
    inp.type = 'number';
    inp.step = step;
    inp.value = value;
    inp.id = 'seg_' + (segInputId++);
    inp.setAttribute('aria-label', 'segment parameter');
    inp.addEventListener('input', () => {
      const v = parseFloat(inp.value);
      if (!isFinite(v)) { inp.classList.add('bad'); return; }
      inp.classList.remove('bad');
      oncommit(v);
      regenerate();
    });
    if (tag) {
      inp.addEventListener('focus', () => { if (isolate_on_hover) setFocusTag(tag); });
      inp.addEventListener('blur', () => setFocusTag(null));
    }
    return inp;
  };

  for (let i = 0; i < state.segment_length.length; i++) {
    const tr = document.createElement('tr');
    const idx = document.createElement('td');
    idx.textContent = i;
    tr.appendChild(idx);
    cell(tr, num(state.segment_length[i], 1, 'straights', v => { state.segment_length[i] = v; }));
    if (i < state.segment_length.length - 1) {
      cell(tr, num(state.segment_angle[i], 5, 'bends', v => { state.segment_angle[i] = v; }));
      cell(tr, num(state.segment_inner_radius[i], 0.5, 'bends', v => { state.segment_inner_radius[i] = v; }));
    } else {
      cell(tr, null);
      cell(tr, null);
    }
    tb.appendChild(tr);
  }
  table.appendChild(tb);
  wrap.appendChild(table);
}

function refreshPanelValues() {
  for (const group of GROUPS) {
    for (const item of group.items) {
      const input = document.getElementById('in_' + item.key);
      if (!input) continue;
      input.classList.remove('bad');
      if (item.type === 'bool') input.checked = state[item.key];
      else if (item.type === 'array') input.value = state[item.key].join(', ');
      else input.value = state[item.key];
    }
  }
  rebuildSegmentTable();
}

/* ------------------------------ generation ---------------------------- */
function validate() {
  if (state.track_widths.length < 2)
    throw new Error('At least 2 tracks are required.');
  if (state.segment_length.length < 1)
    throw new Error('At least 1 segment is required.');
  if (state.segment_angle.length !== state.segment_length.length - 1)
    throw new Error(`segment_angle needs ${state.segment_length.length - 1} entries (one fewer than segment lengths), got ${state.segment_angle.length}.`);
  if (state.segment_inner_radius.length !== state.segment_length.length - 1)
    throw new Error(`segment_inner_radius needs ${state.segment_length.length - 1} entries (one fewer than segment lengths), got ${state.segment_inner_radius.length}.`);
  if (state.track_widths.some(w => w <= 0))
    throw new Error('Track widths must all be > 0.');
}

function regenerate() {
  try {
    validate();
    apply_params(state);
    primitives = [];
    miters = [];
    current_polygon = null;
    scr_lines = [];
    track_lengths = [];
    override_inter_track_spacing_angle = 0;

    output_eagle_script();
    apply_miters();
    outline_loops = null;

    for (const i of [...selectedTracks])
      if (i >= track_widths.length) selectedTracks.delete(i);

    errorBox.style.display = 'none';
    encode_share_hash();
    snapshot_state();
    updateUndoButtons();
    render();
    renderTracksTab();
    renderDRC();
  } catch (e) {
    errorBox.textContent = e.message;
    errorBox.style.display = 'block';
  }
}

/* --------------------------- canvas interaction ----------------------- */
let panning = null;
const cursorBox = document.getElementById('cursorpos');
const trackEditor = document.getElementById('track-editor');

function screenToWorld(mx, my) {
  const w = canvas.clientWidth, h = canvas.clientHeight;
  return [view.x + (mx - w / 2) / view.scale, view.y - (my - h / 2) / view.scale];
}

function angle_in_sweep(angle, g) {
  const sweep = g.ccw ? mod2pi(g.a2 - g.a1) : mod2pi(g.a1 - g.a2);
  const off = g.ccw ? mod2pi(angle - g.a1) : mod2pi(g.a1 - angle);
  return off <= sweep;
}

function hitTrack(wx, wy) {
  const tol = 3 / view.scale;
  let best = null, bestD = Infinity;
  for (const p of primitives) {
    if (p.layer !== top_layer_number || p.net === null || p.net === undefined) continue;
    if (p.type === 'wire') {
      const dx = p.x2 - p.x1, dy = p.y2 - p.y1;
      const len2 = dx * dx + dy * dy;
      const t = len2 ? Math.max(0, Math.min(1, ((wx - p.x1) * dx + (wy - p.y1) * dy) / len2)) : 0;
      const d = Math.hypot(wx - (p.x1 + t * dx), wy - (p.y1 + t * dy));
      if (d < p.width / 2 + tol && d < bestD) { bestD = d; best = p.net; }
    } else if (p.type === 'arc') {
      const g = eagleArcGeometry(p);
      if (!g) continue;
      const dc = Math.hypot(wx - g.cx, wy - g.cy);
      const d = Math.abs(dc - g.r);
      if (d < p.width / 2 + tol && d < bestD && angle_in_sweep(Math.atan2(wy - g.cy, wx - g.cx), g)) {
        bestD = d; best = p.net;
      }
    } else if (p.type === 'polygon') {
      let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
      for (const q of p.points) {
        minX = Math.min(minX, q.x); maxX = Math.max(maxX, q.x);
        minY = Math.min(minY, q.y); maxY = Math.max(maxY, q.y);
      }
      const m = p.width / 2 + tol;
      if (wx > minX - m && wx < maxX + m && wy > minY - m && wy < maxY + m && bestD > 0) {
        bestD = 0; best = p.net;
      }
    }
  }
  return best;
}

function showTrackEditor(i, clientX, clientY) {
  trackEditor.innerHTML = '';
  const head = document.createElement('div');
  head.className = 'te-head';
  head.textContent = `Track ${i}`;
  const closeBtn = document.createElement('button');
  closeBtn.textContent = '×';
  closeBtn.title = 'Close';
  closeBtn.addEventListener('click', () => { hideTrackEditor(); selectedTracks.clear(); render(); renderTracksTab(); });
  head.appendChild(closeBtn);

  const row = document.createElement('div');
  row.className = 'row';
  const l = document.createElement('label');
  l.textContent = 'Width (mm)';
  const inp = document.createElement('input');
  inp.type = 'number';
  inp.step = 0.05; inp.min = 0.05;
  inp.value = state.track_widths[i];
  inp.id = 'te-width';
  l.htmlFor = inp.id;

  const info = document.createElement('div');
  info.className = 'mini-note';
  const updateInfo = () => {
    info.textContent = `L ${(track_lengths[i] || 0).toFixed(1)} mm · R ${(track_resistance(i) * 1000).toFixed(1)} mΩ · Imax ${track_imax(state.track_widths[i]).toFixed(2)} A`;
  };
  updateInfo();

  inp.addEventListener('input', () => {
    const v = parseFloat(inp.value);
    if (!isFinite(v) || v <= 0) return;
    state.track_widths[i] = v;
    refreshPanelValues();
    regenerate();
    updateInfo();
  });
  row.append(l, inp);

  const removeBtn = document.createElement('button');
  removeBtn.className = 'danger';
  removeBtn.textContent = 'Remove track';
  removeBtn.addEventListener('click', () => {
    if (state.track_widths.length <= 2) return;
    state.track_widths.splice(i, 1);
    selectedTracks.clear();
    hideTrackEditor();
    refreshPanelValues();
    regenerate();
  });

  trackEditor.append(head, row, info, removeBtn);
  const wrap = document.getElementById('canvas-wrap');
  const rect = wrap.getBoundingClientRect();
  trackEditor.style.display = 'block';
  const x = Math.min(clientX - rect.left + 14, rect.width - 200);
  const y = Math.min(clientY - rect.top + 14, rect.height - 160);
  trackEditor.style.left = Math.max(8, x) + 'px';
  trackEditor.style.top = Math.max(8, y) + 'px';
}

function hideTrackEditor() { trackEditor.style.display = 'none'; }

function handleCanvasClick(e) {
  const rect = canvas.getBoundingClientRect();
  const [wx, wy] = screenToWorld(e.clientX - rect.left, e.clientY - rect.top);

  if (measure.active) {
    if (!measure.a || (measure.a && measure.b)) {
      measure.a = [wx, wy];
      measure.b = null;
      measure.cursor = null;
    } else {
      measure.b = [wx, wy];
    }
    render();
    return;
  }

  const hit = hitTrack(wx, wy);
  selectedTracks.clear();
  if (hit !== null) {
    selectedTracks.add(hit);
    showTrackEditor(hit, e.clientX, e.clientY);
  } else {
    hideTrackEditor();
  }
  render();
  renderTracksTab();
}

/* pan momentum: velocity is sampled over the last ~120 ms of the drag and
   decays exponentially after release */
const momentum = { vx: 0, vy: 0, raf: null, lastT: 0 };

function stopMomentum() {
  if (momentum.raf) { cancelAnimationFrame(momentum.raf); momentum.raf = null; }
}

function startMomentum() {
  if (Math.hypot(momentum.vx, momentum.vy) < 60) return;   // px/s - ignore slow releases
  momentum.lastT = performance.now();
  const step = now => {
    const dt = Math.min((now - momentum.lastT) / 1000, 0.05);
    momentum.lastT = now;
    view.x -= momentum.vx * dt / view.scale;
    view.y += momentum.vy * dt / view.scale;
    const decay = Math.exp(-dt / 0.3);
    momentum.vx *= decay;
    momentum.vy *= decay;
    render();
    momentum.raf = Math.hypot(momentum.vx, momentum.vy) > 20 ? requestAnimationFrame(step) : null;
  };
  momentum.raf = requestAnimationFrame(step);
}

canvas.addEventListener('pointerdown', e => {
  stopMomentum();
  panning = { x: e.clientX, y: e.clientY, vx: view.x, vy: view.y, moved: false, samples: [] };
  canvas.classList.add('panning');
  canvas.setPointerCapture(e.pointerId);
});
canvas.addEventListener('pointermove', e => {
  const rect = canvas.getBoundingClientRect();
  const [wx, wy] = screenToWorld(e.clientX - rect.left, e.clientY - rect.top);
  cursorBox.textContent = `${wx.toFixed(2)}, ${wy.toFixed(2)} mm`;

  if (measure.active && measure.a && !measure.b) {
    measure.cursor = [wx, wy];
    render();
  }
  if (!panning) return;
  if (Math.hypot(e.clientX - panning.x, e.clientY - panning.y) > 4) panning.moved = true;
  if (panning.moved) {
    const now = performance.now();
    panning.samples.push({ t: now, x: e.clientX, y: e.clientY });
    while (panning.samples.length > 2 && now - panning.samples[0].t > 120) panning.samples.shift();
    view.x = panning.vx - (e.clientX - panning.x) / view.scale;
    view.y = panning.vy + (e.clientY - panning.y) / view.scale;
    render();
  }
});
canvas.addEventListener('pointerup', e => {
  const wasClick = panning && !panning.moved;
  const samples = panning ? panning.samples : [];
  panning = null;
  canvas.classList.remove('panning');
  canvas.releasePointerCapture(e.pointerId);
  if (wasClick) {
    handleCanvasClick(e);
    return;
  }
  if (samples.length >= 2) {
    const a = samples[0], b = samples[samples.length - 1];
    const dt = (b.t - a.t) / 1000;
    if (dt > 0.01) {
      momentum.vx = (b.x - a.x) / dt;
      momentum.vy = (b.y - a.y) / dt;
      startMomentum();
    }
  }
});

document.getElementById('undo-btn').addEventListener('click', do_undo);
document.getElementById('redo-btn').addEventListener('click', do_redo);
document.addEventListener('keydown', e => {
  if (!(e.metaKey || e.ctrlKey) || e.key.toLowerCase() !== 'z') return;
  const t = e.target;
  if (t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.tagName === 'SELECT')) return;  // keep native input undo
  e.preventDefault();
  if (e.shiftKey) do_redo(); else do_undo();
});

const measureBtn = document.getElementById('measure-btn');
measureBtn.addEventListener('click', () => {
  measure.active = !measure.active;
  measure.a = measure.b = measure.cursor = null;
  measureBtn.classList.toggle('active', measure.active);
  canvas.style.cursor = measure.active ? 'crosshair' : 'grab';
  if (measure.active) hideTrackEditor();
  render();
});
canvas.addEventListener('wheel', e => {
  e.preventDefault();
  stopMomentum();
  const rect = canvas.getBoundingClientRect();
  const mx = e.clientX - rect.left, my = e.clientY - rect.top;
  const wx = view.x + (mx - rect.width / 2) / view.scale;
  const wy = view.y - (my - rect.height / 2) / view.scale;
  const factor = Math.exp(-e.deltaY * 0.0015);
  view.scale = Math.min(Math.max(view.scale * factor, 0.05), 2000);
  view.x = wx - (mx - rect.width / 2) / view.scale;
  view.y = wy + (my - rect.height / 2) / view.scale;
  render();
}, { passive: false });
canvas.addEventListener('dblclick', () => { if (!measure.active) fitView(); });
document.getElementById('fit').addEventListener('click', fitView);
new ResizeObserver(() => render()).observe(canvas);

/* ------------------------------ presets UI ---------------------------- */
const presetSelect = document.getElementById('preset');
for (const name of Object.keys(PRESETS)) {
  const opt = document.createElement('option');
  opt.value = name;
  opt.textContent = name;
  presetSelect.appendChild(opt);
}
presetSelect.addEventListener('change', () => {
  Object.assign(state, JSON.parse(JSON.stringify(PRESETS[presetSelect.value])));
  selectedTracks.clear();
  hideTrackEditor();
  refreshPanelValues();
  regenerate();
  fitView();
});

/* --------------------------------- boot ------------------------------- */
const shared = decode_share_hash();
if (shared) {
  Object.assign(state, shared.p);
  if (shared.e) {
    if (shared.e.t > 0) electrical.thickness_um = shared.e.t;
    if (shared.e.dT > 0) electrical.deltaT = shared.e.dT;
  }
} else {
  // no shared design in the URL - restore the last session's autosave
  try {
    const auto = localStorage.getItem('ffsc-autosave');
    if (auto) Object.assign(state, JSON.parse(auto));
  } catch (e) { /* corrupt or unavailable - start from the default preset */ }
}
buildPanel();
buildTracksPanel();
buildDRCPanel();
buildAppearancePanel();
buildExportPanel();
regenerate();
fitView();
</script>
