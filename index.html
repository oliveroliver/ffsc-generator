<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FFSC Generator</title>
<style>
  :root {
    --panel-bg: #1c2128;
    --panel-fg: #d7dde4;
    --panel-muted: #8b98a5;
    --panel-border: #313a44;
    --accent: #ffad22;
    --input-bg: #12161b;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; min-width: 900px; }  /* scroll rather than crush the layout on narrow windows */
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    display: flex; overflow: hidden; background: #fff;
  }
  #canvas-wrap { position: relative; flex: 1; min-width: 0; }
  #board { position: absolute; inset: 0; width: 100%; height: 100%; cursor: grab; }
  #board.panning { cursor: grabbing; }
  #error {
    position: absolute; top: 12px; left: 12px; right: 12px; z-index: 3;
    background: #b3261e; color: #fff; padding: 8px 12px; border-radius: 6px;
    font-size: 13px; display: none; white-space: pre-wrap;
  }
  #status {
    position: absolute; left: 12px; bottom: 10px; z-index: 2;
    font-size: 12px; color: #5b6b7a; background: rgba(255,255,255,.85);
    padding: 3px 8px; border-radius: 4px; pointer-events: none;
  }
  #cursorpos {
    position: absolute; right: 12px; bottom: 10px; z-index: 2;
    font-size: 12px; color: #5b6b7a; background: rgba(255,255,255,.85);
    padding: 3px 8px; border-radius: 4px; pointer-events: none;
    font-variant-numeric: tabular-nums;
  }
  #hud { position: absolute; top: 12px; right: 12px; z-index: 2; display: flex; gap: 6px; }
  #hud button {
    background: rgba(28,33,40,.92); color: #d7dde4;
    border: 1px solid #313a44; border-radius: 5px; padding: 5px 10px; font-size: 13px;
  }
  #hud button.active { border-color: var(--accent); color: #fff; }
  #track-editor {
    position: absolute; z-index: 4; display: none;
    background: var(--panel-bg); color: var(--panel-fg);
    border: 1px solid var(--panel-border); border-radius: 8px; padding: 10px 12px;
    font-size: 13px; box-shadow: 0 4px 16px rgba(0,0,0,.35); min-width: 170px;
  }
  #track-editor .te-head { display: flex; justify-content: space-between; gap: 16px; align-items: center; font-weight: 600; }
  #track-editor .te-head button { border: none; background: none; color: var(--panel-muted); padding: 0 2px; font-size: 15px; }
  #track-editor .row { margin-top: 8px; display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  #track-editor input[type="number"] { width: 74px; }
  #track-editor button.danger { border-color: #8a3a34; color: #ff8b81; width: 100%; margin-top: 8px; }
  table.tracks { width: 100%; border-collapse: collapse; margin-top: 6px; font-variant-numeric: tabular-nums; }
  table.tracks th, table.tracks td { text-align: right; padding: 3px 4px; border-bottom: 1px solid var(--panel-border); font-size: 12px; }
  table.tracks th { color: var(--panel-muted); font-weight: 600; }
  table.tracks td:first-child, table.tracks th:first-child { text-align: left; }
  table.tracks tbody tr { cursor: pointer; }
  table.tracks tr.sel td { background: rgba(255,173,34,.12); }
  table.tracks tr.viol td { color: #ff8b81; }
  table.segs input { width: 100%; min-width: 52px; padding: 2px 6px; }
  table.segs td:first-child { color: var(--panel-muted); }
  .btn-row { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
  .btn-row button { flex: 1; white-space: nowrap; }
  .mini-note { color: var(--panel-muted); font-size: 11.5px; margin-top: 6px; line-height: 1.4; }
  #panel {
    width: 368px; flex: none; background: var(--panel-bg); color: var(--panel-fg);
    overflow-y: auto; border-left: 1px solid var(--panel-border);
    font-size: 13px;
  }
  #panel header {
    padding: 14px 16px 10px; border-bottom: 1px solid var(--panel-border);
    position: sticky; top: 0; background: var(--panel-bg); z-index: 1;
  }
  #panel h1 { font-size: 15px; margin: 0 0 2px; color: #fff; }
  #panel header p { margin: 0; font-size: 11.5px; color: var(--panel-muted); }
  .preset-row { display: flex; gap: 8px; margin-top: 10px; }
  .preset-row select { flex: 1; }
  .tabs { display: flex; gap: 5px; margin-top: 10px; }
  .tabs button {
    flex: 1; background: transparent; border: 1px solid var(--panel-border);
    padding: 5px 0; color: var(--panel-muted); font-size: 12.5px; white-space: nowrap;
  }
  .tabs button.active { background: var(--input-bg); border-color: var(--accent); color: #fff; }
  .tabs button.drc-warn { color: var(--accent); }
  .tabs button.drc-err { color: #ff8b81; }
  .drc-item {
    display: flex; gap: 8px; align-items: baseline;
    padding: 7px 4px; border-bottom: 1px solid var(--panel-border);
    font-size: 12.5px; line-height: 1.4; cursor: default;
  }
  .drc-item.loc { cursor: pointer; }
  .drc-item.loc:hover { background: rgba(255,255,255,.04); }
  .drc-item .lvl { font-weight: 700; flex: none; }
  .drc-item.err .lvl { color: #ff8b81; }
  .drc-item.warn .lvl { color: var(--accent); }
  .drc-ok { color: #7ee2a8; padding: 8px 4px; font-size: 12.5px; }
  .drc-fix {
    margin-left: auto; flex: none; font-size: 11.5px; padding: 2px 9px;
    border-color: var(--accent); color: var(--accent);
  }
  fieldset {
    border: none; margin: 0; padding: 10px 16px 12px;
    border-bottom: 1px solid var(--panel-border);
  }
  legend {
    font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase;
    color: var(--accent); padding: 0; margin-bottom: 2px;
  }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: 7px; }
  .row label { flex: 1; color: var(--panel-fg); cursor: help; }
  .row input[type="number"] { width: 88px; }
  .row.wide { flex-direction: column; align-items: stretch; gap: 4px; }
  .row.wide label { cursor: help; }
  input, select, button {
    font: inherit; color: var(--panel-fg); background: var(--input-bg);
    border: 1px solid var(--panel-border); border-radius: 5px; padding: 4px 8px;
  }
  input:focus, select:focus { outline: 1px solid var(--accent); border-color: var(--accent); }
  input.bad { border-color: #e5534b; outline: 1px solid #e5534b; }
  input[type="checkbox"] { width: auto; accent-color: var(--accent); }
  button { cursor: pointer; }
  button:hover { border-color: var(--accent); }
  .toggles { display: flex; flex-wrap: wrap; gap: 4px 14px; }
  .toggles label { display: flex; align-items: center; gap: 6px; cursor: pointer; }
  .swatch { width: 10px; height: 10px; border-radius: 2px; display: inline-block; }
</style>
</head>
<body>
  <div id="canvas-wrap">
    <canvas id="board"></canvas>
    <div id="error"></div>
    <div id="status"></div>
    <div id="cursorpos"></div>
    <div id="hud">
      <button id="undo-btn" title="Undo (Ctrl/Cmd+Z)">Undo</button>
      <button id="redo-btn" title="Redo (Ctrl/Cmd+Shift+Z)">Redo</button>
      <button id="measure-btn" title="Click two points to measure. Click again to start a new measurement.">Measure</button>
    </div>
    <div id="track-editor"></div>
  </div>
  <div id="panel">
    <header>
      <h1>FFSC Generator</h1>
      <p>Flat Flexible Soldered Connector &mdash; live preview. All units mm.</p>
      <div class="preset-row">
        <select id="preset"></select>
        <button id="fit" title="Fit board to view (or double-click canvas)">Fit</button>
      </div>
      <div class="tabs">
        <button id="tab-design" class="active">Design</button>
        <button id="tab-tracks">Tracks</button>
        <button id="tab-drc">DRC</button>
        <button id="tab-appearance">Style</button>
        <button id="tab-export">Export</button>
      </div>
    </header>
    <div id="controls"></div>
    <div id="tracks-controls" style="display:none"></div>
    <div id="drc-controls" style="display:none"></div>
    <div id="appearance-controls" style="display:none"></div>
    <div id="export-controls" style="display:none"></div>
  </div>

<script>
'use strict';

/* =====================================================================
 *  FFSC (Flat Flexible Soldered Connector) Generator - browser version
 *  JavaScript port of ffsc-generator.py
 *  Copyright (C) 2016-2026 Oliver S
 *
 *  This program is free software: you can redistribute it and/or modify
 *  it under the terms of the GNU General Public License as published by
 *  the Free Software Foundation, either version 3 of the License, or
 *  any later version.
 *
 *  This program is distributed in the hope that it will be useful,
 *  but WITHOUT ANY WARRANTY; without even the implied warranty of
 *  MERCHANTABILITY or FITNESS FOR A PARTICULAR PURPOSE.  See the
 *  GNU General Public License for more details.
 *
 *  You should have received a copy of the GNU General Public License
 *  along with this program.  If not, see <http://www.gnu.org/licenses/>.
 *
 *  Function names follow the original Python. Instead of writing an Eagle
 *  script, the leaf draw_* functions append primitives to a display list
 *  which is rendered to <canvas> in real time.
 * ===================================================================== */

/* ------------------------- parameters (globals) ---------------------- */
/* Layer numbers are fixed in this port; they only select drawing style. */
const top_layer_number = 16;
const outline_layer_number = 20;
const reinforcement_layer_number = 1;
const net_name_prefix = 'net_';

let polygon_draw_width, outline_corner_radius, outline_angle_radius, outline_draw_width,
    triangles_across_width, triangle_height, taper_distance_from_edge, pad_arc_height,
    distance_arc_from_edge, track_to_edge_spacing, inter_track_spacing_straight,
    inter_track_spacing_angle, symmetry_on_shape, inter_pad_spacing, minimum_pad_width,
    pad_width_to_track_ratio, pad_length_to_max_track_ratio, additional_track_from_pad_length,
    preferred_via_drill_size, minimum_via_to_pad_edge, via_annular_ring, gradient_of_taper,
    segment_length, segment_angle, segment_inner_radius, track_widths;

let override_inter_track_spacing_angle = 0;

function apply_params(p) {
  polygon_draw_width = p.polygon_draw_width;
  outline_corner_radius = p.outline_corner_radius;
  outline_angle_radius = p.outline_angle_radius;
  outline_draw_width = p.outline_draw_width;
  triangles_across_width = p.triangles_across_width;
  triangle_height = p.triangle_height;
  taper_distance_from_edge = p.taper_distance_from_edge;
  pad_arc_height = p.pad_arc_height;
  distance_arc_from_edge = p.distance_arc_from_edge;
  track_to_edge_spacing = p.track_to_edge_spacing;
  inter_track_spacing_straight = p.inter_track_spacing_straight;
  inter_track_spacing_angle = p.inter_track_spacing_angle;
  symmetry_on_shape = p.symmetry_on_shape;
  inter_pad_spacing = p.inter_pad_spacing;
  minimum_pad_width = p.minimum_pad_width;
  pad_width_to_track_ratio = p.pad_width_to_track_ratio;
  pad_length_to_max_track_ratio = p.pad_length_to_max_track_ratio;
  additional_track_from_pad_length = p.additional_track_from_pad_length;
  preferred_via_drill_size = p.preferred_via_drill_size;
  minimum_via_to_pad_edge = p.minimum_via_to_pad_edge;
  via_annular_ring = p.via_annular_ring;
  gradient_of_taper = p.gradient_of_taper;
  segment_length = p.segment_length.slice();
  segment_angle = p.segment_angle.slice();
  segment_inner_radius = p.segment_inner_radius.slice();
  track_widths = p.track_widths.slice();
}

/* ----------------------------- display list -------------------------- */
let primitives = [];        // wires, arcs, polygons, fillets, vias
let miters = [];            // pending MITER commands, applied after generation
let current_polygon = null;
let scr_lines = [];         // Eagle script text, emitted alongside the primitives
let track_lengths = [];     // per-connection copper length in mm, accumulated during generation

const rad = d => d * Math.PI / 180;

/* Python's '%.6g' equivalent, as used by the original generator */
const g6 = x => String(Number(Number(x).toPrecision(6)));
const g6s = x => (x >= 0 ? '+' : '') + g6(x);

const net_index = signal_name => (/^\d+$/.test(signal_name) ? parseInt(signal_name, 10) : null);

function add_track_length(signal_name, layer_number, mm) {
  const i = net_index(signal_name);
  if (i === null || layer_number !== top_layer_number) return;
  track_lengths[i] = (track_lengths[i] || 0) + mm;
}

/* rotates a point around a point */
function rotate_2d(degrees, point_x, point_y, origin_x, origin_y) {
  degrees *= -1;

  const x = point_x - origin_x;
  const y = point_y - origin_y;

  let new_x = (x * Math.cos(rad(degrees))) - (y * Math.sin(rad(degrees)));
  let new_y = (x * Math.sin(rad(degrees))) + (y * Math.cos(rad(degrees)));

  new_x += origin_x;
  new_y += origin_y;

  return [new_x, new_y];
}

/* starts, continues or finishes a polygon (Eagle POLYGON equivalent).
   state 0 = first point, 1 = mid point, 2 = end point.
   radius: 0 = straight segment to the next point, otherwise the arc
   diameter (2R) for that segment; sign picks the bulge side. */
function draw_part_poly_eagle(signal_name, layer_number, width, poly_point_x, poly_point_y, radius, state) {
  if (state === 0) {
    current_polygon = { type: 'polygon', signal: net_name_prefix + signal_name, net: net_index(signal_name),
                        layer: layer_number, width: width, points: [] };
    current_polygon.points.push({ x: poly_point_x, y: poly_point_y, curve: radius });
    scr_lines.push(`LAYER ${layer_number};\n`);
    scr_lines.push(`POLYGON ${net_name_prefix}${signal_name} ${g6(width)} (${g6(poly_point_x)} ${g6(poly_point_y)}) @${g6s(radius)} `);
  } else if (state === 1) {
    current_polygon.points.push({ x: poly_point_x, y: poly_point_y, curve: radius });
    scr_lines.push(`(${g6(poly_point_x)} ${g6(poly_point_y)}) @${g6s(radius)} `);
  } else {
    current_polygon.points.push({ x: poly_point_x, y: poly_point_y, curve: 0 });
    primitives.push(current_polygon);
    current_polygon = null;
    scr_lines.push(`(${g6(poly_point_x)} ${g6(poly_point_y)});\n`);
  }
}

function draw_part_poly_transform(segment_number, signal_name, layer_number, width, poly_point_x, poly_point_y, radius, state) {
  [poly_point_x, poly_point_y] = calc_new_point(segment_number, poly_point_x, poly_point_y);
  draw_part_poly_eagle(signal_name, layer_number, width, poly_point_x, poly_point_y, radius, state);
}

/* a rectangle drawn as a poly, with transform included */
function draw_rect_poly_transform(segment_number, signal_name, layer_number, width, pad_start_x, pad_start_y, pad_finish_x, pad_finish_y) {
  draw_part_poly_transform(segment_number, signal_name, layer_number, width, pad_start_x + (polygon_draw_width / 2), pad_start_y + (polygon_draw_width / 2), 0, 0);
  draw_part_poly_transform(segment_number, signal_name, layer_number, width, pad_finish_x - (polygon_draw_width / 2), pad_start_y + (polygon_draw_width / 2), 0, 1);
  draw_part_poly_transform(segment_number, signal_name, layer_number, width, pad_finish_x - (polygon_draw_width / 2), pad_finish_y - (polygon_draw_width / 2), 0, 1);
  draw_part_poly_transform(segment_number, signal_name, layer_number, width, pad_start_x + (polygon_draw_width / 2), pad_finish_y - (polygon_draw_width / 2), 0, 1);
  draw_part_poly_transform(segment_number, signal_name, layer_number, width, pad_start_x + (polygon_draw_width / 2), pad_start_y + (polygon_draw_width / 2), 0, 2);
}

/* draws a trace (Eagle WIRE equivalent) */
function draw_wire(signal_name, layer_number, wire_width, wire_start_x, wire_start_y, wire_finish_x, wire_finish_y) {
  primitives.push({ type: 'wire', signal: net_name_prefix + signal_name, net: net_index(signal_name), layer: layer_number,
                    width: wire_width, x1: wire_start_x, y1: wire_start_y, x2: wire_finish_x, y2: wire_finish_y });
  scr_lines.push(`LAYER ${layer_number};\n`);
  scr_lines.push(`WIRE '${net_name_prefix}${signal_name}' ${g6(wire_width)} (${g6(wire_start_x)} ${g6(wire_start_y)}) (${g6(wire_finish_x)} ${g6(wire_finish_y)});\n`);
  add_track_length(signal_name, layer_number, Math.hypot(wire_finish_x - wire_start_x, wire_finish_y - wire_start_y));
}

function draw_wire_transform(segment_number, signal_name, layer_number, wire_width, wire_start_x, wire_start_y, wire_finish_x, wire_finish_y) {
  [wire_start_x, wire_start_y] = calc_new_point(segment_number, wire_start_x, wire_start_y);
  [wire_finish_x, wire_finish_y] = calc_new_point(segment_number, wire_finish_x, wire_finish_y);

  draw_wire(signal_name, layer_number, wire_width, wire_start_x, wire_start_y, wire_finish_x, wire_finish_y);
}

/* place a via (Eagle VIA equivalent) */
function draw_via(signal_name, via_diameter, drill_diameter, layer_range, via_position_x, via_position_y) {
  primitives.push({ type: 'via', signal: net_name_prefix + signal_name,
                    diameter: via_diameter, drill: drill_diameter, x: via_position_x, y: via_position_y });
  scr_lines.push(`CHANGE DRILL ${g6(drill_diameter)};\n`);
  scr_lines.push(`VIA '${net_name_prefix}${signal_name}' ${g6(via_diameter)} Round ${layer_range} (${g6(via_position_x)} ${g6(via_position_y)});\n`);
}

function draw_via_transform(segment_number, signal_name, via_diameter, drill_diameter, layer_range, via_position_x, via_position_y) {
  [via_position_x, via_position_y] = calc_new_point(segment_number, via_position_x, via_position_y);
  draw_via(signal_name, via_diameter, drill_diameter, layer_range, via_position_x, via_position_y);
}

/* draws an arc (Eagle ARC equivalent): start point, the point diametrically
   opposite the start (defines the circle), and the point giving the end angle */
function draw_arc(signal_name, layer_number, wire_width, clockwise, arc_start_x, arc_start_y, arc_diameter_x, arc_diameter_y, arc_finish_x, arc_finish_y) {
  const p = { type: 'arc', signal: net_name_prefix + signal_name, net: net_index(signal_name), layer: layer_number,
              width: wire_width, clockwise: clockwise,
              x1: arc_start_x, y1: arc_start_y, dx: arc_diameter_x, dy: arc_diameter_y,
              x2: arc_finish_x, y2: arc_finish_y };
  primitives.push(p);
  const clockwise_verbose = clockwise === true ? 'CW' : 'CCW';
  scr_lines.push(`LAYER ${layer_number}\n`);   // (sic - the original generator omits the semicolon here)
  scr_lines.push(`ARC '${net_name_prefix}${signal_name}' ${clockwise_verbose} ROUND ${g6(wire_width)} (${g6(arc_start_x)} ${g6(arc_start_y)}) (${g6(arc_diameter_x)} ${g6(arc_diameter_y)}) (${g6(arc_finish_x)} ${g6(arc_finish_y)});\n`);
  const g = eagleArcGeometry(p);
  if (g) {
    const sweep = g.ccw ? mod2pi(g.a2 - g.a1) : mod2pi(g.a1 - g.a2);
    add_track_length(signal_name, layer_number, g.r * sweep);
  }
}

/* adds a radius where two wires meet (Eagle MITER equivalent) */
function mitre_point(radius, mitre_x, mitre_y) {
  miters.push({ radius: radius, x: mitre_x, y: mitre_y });
  scr_lines.push(`MITER ${g6(radius)} (${g6(mitre_x)} ${g6(mitre_y)});\n`);
}

function mitre_point_transform(segment_number, radius, mitre_x, mitre_y) {
  [mitre_x, mitre_y] = calc_new_point(segment_number, mitre_x, mitre_y);
  mitre_point(radius, mitre_x, mitre_y);
}

/* ------------------------- geometry (ported as-is) -------------------- */

/* return the pad width according to the pad to track ratio and minimum pad size */
function calc_pad_width(connection_number) {
  if ((track_widths[connection_number] * pad_width_to_track_ratio) < minimum_pad_width)
    return minimum_pad_width;
  else
    return track_widths[connection_number] * pad_width_to_track_ratio;
}

/* calculate and return the start and end co-ordinates and the centre value */
function calc_pad_coordinates(segment_number, connection_number) {
  const pad_length = pad_length_to_max_track_ratio * (pad_width_to_track_ratio * Math.max(...track_widths));

  let sum_of_pad_widths = 0;
  for (let i = 0; i < track_widths.length; i++)
    sum_of_pad_widths += calc_pad_width(i);

  sum_of_pad_widths += inter_pad_spacing * (track_widths.length - 1);

  const pad_finish_y = segment_length[segment_number];
  const pad_start_y = pad_finish_y - pad_length;

  let pad_offset_x = 0;
  for (let i = 0; i < connection_number; i++)
    pad_offset_x += calc_pad_width(i);

  pad_offset_x += inter_pad_spacing * connection_number;

  const pad_width = calc_pad_width(connection_number);
  const pad_start_x = 0 - (sum_of_pad_widths / 2) + pad_offset_x;
  const pad_finish_x = 0 - (sum_of_pad_widths / 2) + pad_offset_x + pad_width;
  const pad_centre_x = 0 - (sum_of_pad_widths / 2) + pad_offset_x + (pad_width / 2);

  return [pad_start_x, pad_start_y, pad_finish_x, pad_finish_y, pad_centre_x, pad_width, pad_length];
}

/* x coordinate of the centre of the requested track, relative to the centre of the bundle */
function calc_track_centre_x(connection_number) {
  const sum_of_track_widths = track_widths.reduce((a, b) => a + b, 0) + (inter_track_spacing_straight * (track_widths.length - 1));

  let track_offset_x = 0;
  for (let i = 0; i < connection_number; i++)
    track_offset_x += track_widths[i];

  track_offset_x += inter_track_spacing_straight * connection_number;
  const track_left_x = 0 - (sum_of_track_widths / 2) + track_offset_x;
  const track_centre_x = track_left_x + (track_widths[connection_number] / 2);

  return track_centre_x;
}

/* perpendicular offset during the taper from the centre connection */
function calc_perpendicular_offset(segment_number, connection_number, closest_centre_x_connection) {
  let next_angle_track_offset = 0;
  let step;

  if (calc_track_centre_x(connection_number) < calc_pad_coordinates(segment_number, connection_number)[4])
    step = 1;
  else
    step = -1;

  for (let i = closest_centre_x_connection; (step > 0 ? i < connection_number : i > connection_number); i += step) {
    if (override_inter_track_spacing_angle !== 0)
      next_angle_track_offset += (track_widths[i] / 2) + override_inter_track_spacing_angle + (track_widths[i + step] / 2);
    else
      next_angle_track_offset += (track_widths[i] / 2) + inter_track_spacing_angle + (track_widths[i + step] / 2);
  }

  return next_angle_track_offset;
}

function calc_meeting_y(segment_number, connection_number, centre_x_connection, m, x, additional_hyp_offset, c) {
  const y_intersect = (calc_pad_coordinates(segment_number, centre_x_connection)[1] - additional_track_from_pad_length) - (m * calc_pad_coordinates(segment_number, centre_x_connection)[4]);
  const y_offset = (1 / Math.cos(Math.atan(m))) * (calc_perpendicular_offset(segment_number, connection_number, centre_x_connection) + additional_hyp_offset);
  const meet_y = (m * x) + (y_intersect - y_offset - c);

  return [y_intersect, y_offset, meet_y];
}

/* distance on y between (pad_centre_x, pad_start_y) and a track that would overshoot into the pad, else 0 */
function calc_minimum_pad_length_ajustment(segment_number, connection_number, closest_centre_x_connection) {
  const [, pad_start_y, , , pad_centre_x] = calc_pad_coordinates(segment_number, connection_number);
  const track_centre_x = calc_track_centre_x(connection_number);

  const m = (track_centre_x < pad_centre_x) ? gradient_of_taper : -gradient_of_taper;

  let total_additional_y_offset = 0;
  let track_meet_pad_centre_y;

  if (connection_number <= closest_centre_x_connection)
    track_meet_pad_centre_y = calc_meeting_y(segment_number, connection_number, closest_centre_x_connection, m, calc_pad_coordinates(segment_number, connection_number)[4], 0, 0)[2];
  else
    track_meet_pad_centre_y = calc_meeting_y(segment_number, connection_number, closest_centre_x_connection + 1, m, calc_pad_coordinates(segment_number, connection_number)[4], 0, 0)[2];

  if (track_meet_pad_centre_y > (pad_start_y - additional_track_from_pad_length))
    total_additional_y_offset = track_meet_pad_centre_y - (pad_start_y - additional_track_from_pad_length);

  return total_additional_y_offset;
}

/* maximum value returned from any connection by calc_minimum_pad_length_ajustment */
function find_max_overshoot(segment_number, closest_centre_x_connection) {
  let max_overshoot_y = 0;

  // fixed inherited off-by-one: the original excluded the last track from the scan
  for (let i = 0; i < track_widths.length; i++) {
    if (calc_minimum_pad_length_ajustment(segment_number, i, closest_centre_x_connection) > max_overshoot_y)
      max_overshoot_y = calc_minimum_pad_length_ajustment(segment_number, i, closest_centre_x_connection);
  }

  return max_overshoot_y;
}

/* difference between the track y intersects of the outer tracks: +ve if left needs to come down, -ve if right */
function calc_symmetrical_offset(segment_number, closest_centre_x_connection) {
  if (symmetry_on_shape === false)
    return 0;

  const left_track_edge_intersect_y = calc_meeting_y(segment_number, 0, closest_centre_x_connection, -gradient_of_taper, (calc_track_centre_x(0) - (track_widths[0] / 2)), (track_widths[0] / 2), find_max_overshoot(segment_number, closest_centre_x_connection))[2];

  const right_track_edge_intersect_y = calc_meeting_y(segment_number, track_widths.length - 1, closest_centre_x_connection + 1, gradient_of_taper, (calc_track_centre_x(track_widths.length - 1) + (track_widths[track_widths.length - 1] / 2)), (track_widths[track_widths.length - 1] / 2), find_max_overshoot(segment_number, closest_centre_x_connection))[2];

  return left_track_edge_intersect_y - right_track_edge_intersect_y;
}

/* draw a single track in either of the end segments, joining the pad to the narrower portion */
function draw_connection(segment_number, connection_number, closest_centre_x_connection) {
  const [, pad_start_y, , , pad_centre_x, , pad_length] = calc_pad_coordinates(segment_number, connection_number);
  const track_centre_x = calc_track_centre_x(connection_number);

  const m = (track_centre_x < pad_centre_x) ? gradient_of_taper : -gradient_of_taper;

  const total_additional_spacing = find_max_overshoot(segment_number, closest_centre_x_connection);
  let symmetrical_edge_offset_y = calc_symmetrical_offset(segment_number, closest_centre_x_connection);

  if ((symmetrical_edge_offset_y > 0) && (connection_number <= closest_centre_x_connection)) {
    symmetrical_edge_offset_y = calc_symmetrical_offset(segment_number, closest_centre_x_connection);
    override_inter_track_spacing_angle = (Math.abs(Math.cos(Math.atan(m)) * symmetrical_edge_offset_y) / closest_centre_x_connection) + inter_track_spacing_angle;
  } else if ((symmetrical_edge_offset_y < 0) && (connection_number > closest_centre_x_connection)) {
    symmetrical_edge_offset_y = calc_symmetrical_offset(segment_number, closest_centre_x_connection);
    override_inter_track_spacing_angle = (Math.abs(Math.cos(Math.atan(m)) * symmetrical_edge_offset_y) / ((track_widths.length - 1) - (closest_centre_x_connection + 1))) + inter_track_spacing_angle;
  }

  let meet_pad_centre_y, meet_track_centre_y;
  if (connection_number <= closest_centre_x_connection) {
    meet_pad_centre_y = calc_meeting_y(segment_number, connection_number, closest_centre_x_connection, m, pad_centre_x, 0, total_additional_spacing)[2];
    meet_track_centre_y = calc_meeting_y(segment_number, connection_number, closest_centre_x_connection, m, track_centre_x, 0, total_additional_spacing)[2];
  } else {
    meet_pad_centre_y = calc_meeting_y(segment_number, connection_number, closest_centre_x_connection + 1, m, pad_centre_x, 0, total_additional_spacing)[2];
    meet_track_centre_y = calc_meeting_y(segment_number, connection_number, closest_centre_x_connection + 1, m, track_centre_x, 0, total_additional_spacing)[2];
  }

  override_inter_track_spacing_angle = 0;

  draw_wire_transform(segment_number, String(connection_number), top_layer_number, track_widths[connection_number], pad_centre_x, pad_start_y + (pad_length / 2), pad_centre_x, meet_pad_centre_y);
  draw_wire_transform(segment_number, String(connection_number), top_layer_number, track_widths[connection_number], pad_centre_x, meet_pad_centre_y, track_centre_x, meet_track_centre_y);
  draw_wire_transform(segment_number, String(connection_number), top_layer_number, track_widths[connection_number], track_centre_x, meet_track_centre_y, track_centre_x, 0);
}

/* draws the outer cuts for the end sections and the reinforcement layer */
function draw_outer_cut(segment_number, closest_centre_x_connection) {
  const symmetrical_edge_offset_y = calc_symmetrical_offset(segment_number, closest_centre_x_connection);

  // left hand side
  let [pad_start_x, , pad_finish_x, , , pad_width] = calc_pad_coordinates(segment_number, 0);
  let track_centre_x = calc_track_centre_x(0);

  const outline_first_pad_x = pad_start_x - track_to_edge_spacing;
  const outline_first_track_x = track_centre_x - (track_widths[0] / 2) - track_to_edge_spacing;

  let c = 0;
  if (symmetrical_edge_offset_y > 0)
    c += symmetrical_edge_offset_y;

  const left_outline_pad_intersect_y = calc_meeting_y(segment_number, 0, closest_centre_x_connection, -gradient_of_taper, outline_first_pad_x, track_to_edge_spacing + (track_widths[0] / 2), find_max_overshoot(segment_number, closest_centre_x_connection) + c)[2];
  const left_outline_track_intersect_y = calc_meeting_y(segment_number, 0, closest_centre_x_connection, -gradient_of_taper, outline_first_track_x, track_to_edge_spacing + (track_widths[0] / 2), find_max_overshoot(segment_number, closest_centre_x_connection) + c)[2];

  // right hand side
  [pad_start_x, , pad_finish_x, , , pad_width] = calc_pad_coordinates(segment_number, track_widths.length - 1);
  track_centre_x = calc_track_centre_x(track_widths.length - 1);

  const outline_last_pad_x = pad_finish_x + track_to_edge_spacing;
  const outline_last_track_x = track_centre_x + (track_widths[track_widths.length - 1] / 2) + track_to_edge_spacing;

  c = 0;
  if (symmetrical_edge_offset_y < 0)
    c += -symmetrical_edge_offset_y;

  const right_outline_pad_intersect_y = calc_meeting_y(segment_number, track_widths.length - 1, closest_centre_x_connection + 1, gradient_of_taper, outline_last_pad_x, track_to_edge_spacing + (track_widths[track_widths.length - 1] / 2), find_max_overshoot(segment_number, closest_centre_x_connection) + c)[2];
  const right_outline_track_intersect_y = calc_meeting_y(segment_number, track_widths.length - 1, closest_centre_x_connection + 1, gradient_of_taper, outline_last_track_x, track_to_edge_spacing + (track_widths[track_widths.length - 1] / 2), find_max_overshoot(segment_number, closest_centre_x_connection) + c)[2];

  // draw outline
  draw_wire_transform(segment_number, "outline", outline_layer_number, outline_draw_width, outline_first_pad_x, segment_length[segment_number], outline_last_pad_x, segment_length[segment_number]);   // top line

  draw_wire_transform(segment_number, "outline", outline_layer_number, outline_draw_width, outline_first_pad_x, segment_length[segment_number], outline_first_pad_x, left_outline_pad_intersect_y);    // left upper
  draw_wire_transform(segment_number, "outline", outline_layer_number, outline_draw_width, outline_first_pad_x, left_outline_pad_intersect_y, outline_first_track_x, left_outline_track_intersect_y);  // left angle
  draw_wire_transform(segment_number, "outline", outline_layer_number, outline_draw_width, outline_first_track_x, left_outline_track_intersect_y, outline_first_track_x, 0);                           // left lower

  draw_wire_transform(segment_number, "outline", outline_layer_number, outline_draw_width, outline_last_pad_x, segment_length[segment_number], outline_last_pad_x, right_outline_pad_intersect_y);     // right upper
  draw_wire_transform(segment_number, "outline", outline_layer_number, outline_draw_width, outline_last_pad_x, right_outline_pad_intersect_y, outline_last_track_x, right_outline_track_intersect_y);  // right angle
  draw_wire_transform(segment_number, "outline", outline_layer_number, outline_draw_width, outline_last_track_x, right_outline_track_intersect_y, outline_last_track_x, 0);                            // right lower

  // miter the edges
  mitre_point_transform(segment_number, outline_corner_radius, outline_first_pad_x, segment_length[segment_number]);
  mitre_point_transform(segment_number, outline_angle_radius, outline_first_pad_x, left_outline_pad_intersect_y);
  mitre_point_transform(segment_number, outline_angle_radius, outline_first_track_x, left_outline_track_intersect_y);

  mitre_point_transform(segment_number, outline_corner_radius, outline_last_pad_x, segment_length[segment_number]);
  mitre_point_transform(segment_number, outline_angle_radius, outline_last_pad_x, right_outline_pad_intersect_y);
  mitre_point_transform(segment_number, outline_angle_radius, outline_last_track_x, right_outline_track_intersect_y);

  // draw the reinforcement layer
  draw_part_poly_transform(segment_number, "reinforcement", reinforcement_layer_number, polygon_draw_width, outline_first_pad_x, segment_length[segment_number], 0, 0);

  for (let i = 0; i < track_widths.length; i++) {   // arc shaped fingers around each pad
    [pad_start_x, , pad_finish_x, , , pad_width] = calc_pad_coordinates(segment_number, i);

    draw_part_poly_transform(segment_number, "reinforcement", reinforcement_layer_number, polygon_draw_width, pad_start_x, segment_length[segment_number], 0, 1);
    // arc radius via the intersecting chord theorem, R = (H/2) + ((W^2)/(8*H)),
    // so the drawn arc height equals pad_arc_height, capped at a semicircle.
    // Two inherited bugs fixed here: the original doubled R (Eagle reads the
    // value as a radius, so the arc came out far flatter than the parameter,
    // and got flatter still as the parameter grew past W/2), and it used
    // `segment_number > 1`, flipping the arcs on two-segment boards.
    const arc_h = Math.min(pad_arc_height, pad_width / 2);
    draw_part_poly_transform(segment_number, "reinforcement", reinforcement_layer_number, polygon_draw_width, pad_start_x, segment_length[segment_number] - distance_arc_from_edge, ((segment_number > 0) ? 1 : -1) * ((arc_h / 2) + ((pad_width * pad_width) / (8 * arc_h))), 1);
    draw_part_poly_transform(segment_number, "reinforcement", reinforcement_layer_number, polygon_draw_width, pad_finish_x, segment_length[segment_number] - distance_arc_from_edge, 0, 1);
    draw_part_poly_transform(segment_number, "reinforcement", reinforcement_layer_number, polygon_draw_width, pad_finish_x, segment_length[segment_number], 0, 1);
  }

  [pad_start_x, , pad_finish_x, , , pad_width] = calc_pad_coordinates(segment_number, track_widths.length - 1);
  draw_part_poly_transform(segment_number, "reinforcement", reinforcement_layer_number, polygon_draw_width, outline_last_pad_x, segment_length[segment_number], 0, 1);

  draw_part_poly_transform(segment_number, "reinforcement", reinforcement_layer_number, polygon_draw_width, outline_last_pad_x, segment_length[segment_number] - taper_distance_from_edge, 0, 1);

  for (let i = 0; i < triangles_across_width; i++) {  // triangular tapered stress relief
    draw_part_poly_transform(segment_number, "reinforcement", reinforcement_layer_number, polygon_draw_width, outline_last_pad_x - (((Math.abs(outline_first_pad_x) + outline_last_pad_x) / triangles_across_width) * (i + 1)) + (((Math.abs(outline_first_pad_x) + outline_last_pad_x) / triangles_across_width) / 2), segment_length[segment_number] - taper_distance_from_edge - triangle_height, 0, 1);
    draw_part_poly_transform(segment_number, "reinforcement", reinforcement_layer_number, polygon_draw_width, outline_last_pad_x - (((Math.abs(outline_first_pad_x) + outline_last_pad_x) / triangles_across_width) * (i + 1)), segment_length[segment_number] - taper_distance_from_edge, 0, 1);
  }

  draw_part_poly_transform(segment_number, "reinforcement", reinforcement_layer_number, polygon_draw_width, outline_first_pad_x, segment_length[segment_number] - taper_distance_from_edge, 0, 1);
  draw_part_poly_transform(segment_number, "reinforcement", reinforcement_layer_number, polygon_draw_width, outline_first_pad_x, segment_length[segment_number], 0, 2);
}

/* draw the two vias that make up the castellation ends and solder pass-through */
function draw_vias_all(segment_number) {
  for (let connection_number = 0; connection_number < track_widths.length; connection_number++) {
    const pad_width = calc_pad_coordinates(segment_number, connection_number)[5];

    let via_drill_size;
    if ((preferred_via_drill_size + (via_annular_ring * 2) + (minimum_via_to_pad_edge * 2)) > pad_width)
      via_drill_size = pad_width - (via_annular_ring * 2) - (minimum_via_to_pad_edge * 2);
    else
      via_drill_size = preferred_via_drill_size;

    // castellation end
    draw_via_transform(segment_number, String(connection_number), via_drill_size + (via_annular_ring * 2), via_drill_size, "1-16", calc_pad_coordinates(segment_number, connection_number)[4], segment_length[segment_number]);
    // centre via
    draw_via_transform(segment_number, String(connection_number), via_drill_size + (via_annular_ring * 2), via_drill_size, "1-16", calc_pad_coordinates(segment_number, connection_number)[4], calc_pad_coordinates(segment_number, connection_number)[1] + (calc_pad_coordinates(segment_number, connection_number)[6] / 2));
  }
}

/* pivot point of a segment, assuming all segments are laid out straight */
function calc_segment_rotation_origin(segment_number) {
  let origin_x;
  if (segment_angle[segment_number - 1] < 0)
    origin_x = calc_track_centre_x(0) - segment_inner_radius[segment_number - 1];
  else
    origin_x = calc_track_centre_x(track_widths.length - 1) + segment_inner_radius[segment_number - 1];

  let origin_y = 0;
  for (let i = 1; i < segment_number; i++)
    origin_y += segment_length[i];

  return [origin_x, origin_y];
}

/* absolute pivot point of a segment given the preceding angles */
function calc_abs_segment_origin_recursive(segment_number, count) {
  if (count === 0) {
    return calc_segment_rotation_origin(segment_number);
  } else {
    const [point_x, point_y] = calc_abs_segment_origin_recursive(segment_number, count - 1);
    const [origin_x, origin_y] = calc_abs_segment_origin_recursive(segment_number - (segment_number - count), segment_number - (segment_number - count) - 1);
    return rotate_2d(segment_angle[count - 1], point_x, point_y, origin_x, origin_y);
  }
}

/* transform a point in segment-local coordinates to its absolute location */
function calc_new_point(segment_number, point_x, point_y) {
  let new_x = point_x;
  let new_y = point_y;

  if (segment_number === 0) {           // first segment is just mirrored
    new_x = point_x;
    new_y = -point_y;
  } else {
    let delta_y = 0;
    for (let i = 1; i < segment_number; i++)
      delta_y += segment_length[i];

    new_y += delta_y;

    for (let i = 1; i < segment_number + 1; i++) {
      const [absolute_point_x, absolute_point_y] = calc_abs_segment_origin_recursive(i, i - 1);
      [new_x, new_y] = rotate_2d(segment_angle[i - 1], new_x, new_y, absolute_point_x, absolute_point_y);
    }
  }

  return [new_x, new_y];
}

/* draw the curved section between segments */
function draw_next_connection(angle_number) {
  for (let connection_number = 0; connection_number < track_widths.length; connection_number++) {
    if (segment_angle[angle_number] !== 0) {
      let arc_diameter_x, clockwise;
      if (segment_angle[angle_number] < 0) {
        arc_diameter_x = calc_track_centre_x(connection_number) - ((calc_track_centre_x(connection_number) - calc_track_centre_x(0) + segment_inner_radius[angle_number]) * 2);
        clockwise = false;
      } else {
        arc_diameter_x = calc_track_centre_x(connection_number) + ((calc_track_centre_x(track_widths.length - 1) - calc_track_centre_x(connection_number) + segment_inner_radius[angle_number]) * 2);
        clockwise = true;
      }

      const [arc_track_diameter_x, arc_track_diameter_y] = calc_new_point(angle_number, arc_diameter_x, segment_length[angle_number] * (angle_number !== 0 ? 1 : 0));
      const [arc_track_start_x, arc_track_start_y] = calc_new_point(angle_number, calc_track_centre_x(connection_number), segment_length[angle_number] * (angle_number !== 0 ? 1 : 0));
      const [arc_track_finish_x, arc_track_finish_y] = calc_new_point(angle_number + 1, calc_track_centre_x(connection_number), 0);

      draw_arc(String(connection_number), top_layer_number, track_widths[connection_number], clockwise, arc_track_start_x, arc_track_start_y, arc_track_diameter_x, arc_track_diameter_y, arc_track_finish_x, arc_track_finish_y);

      // draw the outline alongside the outermost tracks
      if (connection_number === 0 || connection_number === track_widths.length - 1) {
        let arc_outline_diameter_x = arc_diameter_x + ((track_to_edge_spacing + (track_widths[connection_number] / 2)) * ((Math.abs(calc_track_centre_x(connection_number)) / calc_track_centre_x(connection_number)) * -1));
        let arc_outline_diameter_y = segment_length[angle_number] * (angle_number !== 0 ? 1 : 0);
        [arc_outline_diameter_x, arc_outline_diameter_y] = calc_new_point(angle_number, arc_outline_diameter_x, arc_outline_diameter_y);
        let arc_outline_start_x = calc_track_centre_x(connection_number) - ((track_to_edge_spacing + (track_widths[connection_number] / 2)) * ((Math.abs(calc_track_centre_x(connection_number)) / calc_track_centre_x(connection_number)) * -1));
        let arc_outline_start_y = segment_length[angle_number] * (angle_number !== 0 ? 1 : 0);
        const [arc_outline_finish_x, arc_outline_finish_y] = calc_new_point(angle_number + 1, arc_outline_start_x, 0);
        [arc_outline_start_x, arc_outline_start_y] = calc_new_point(angle_number, arc_outline_start_x, arc_outline_start_y);

        draw_arc("outline", outline_layer_number, outline_draw_width, clockwise, arc_outline_start_x, arc_outline_start_y, arc_outline_diameter_x, arc_outline_diameter_y, arc_outline_finish_x, arc_outline_finish_y);
      }
    }
  }
}

/* draw an 'inner' segment - any straight segment that isn't an end */
function draw_inner(segment_number) {
  for (let connection_number = 0; connection_number < track_widths.length; connection_number++)
    draw_wire_transform(segment_number, String(connection_number), top_layer_number, track_widths[connection_number], calc_track_centre_x(connection_number), 0, calc_track_centre_x(connection_number), segment_length[segment_number]);

  const outline_first_track_x = calc_track_centre_x(0) - (track_widths[0] / 2) - track_to_edge_spacing;
  draw_wire_transform(segment_number, "outline", outline_layer_number, outline_draw_width, outline_first_track_x, 0, outline_first_track_x, segment_length[segment_number]);

  const outline_last_track_x = calc_track_centre_x(track_widths.length - 1) + (track_widths[track_widths.length - 1] / 2) + track_to_edge_spacing;
  draw_wire_transform(segment_number, "outline", outline_layer_number, outline_draw_width, outline_last_track_x, 0, outline_last_track_x, segment_length[segment_number]);
}

/* segment number needs to be 0 (starting end) or the last (finishing end) */
function draw_end(segment_number) {
  // find the point at which the angled part goes from -ve gradient to a +ve gradient
  let closest_centre_x_connection;
  for (let connection_number = 0; connection_number < track_widths.length; connection_number++) {
    if (calc_track_centre_x(connection_number) > calc_pad_coordinates(0, connection_number)[4])
      closest_centre_x_connection = connection_number;
  }
  if (closest_centre_x_connection === undefined)
    throw new Error("Could not find the centre crossover connection - the pad row is narrower than the track bundle. Adjust pad widths/spacing or track widths.");

  // draw each of the pads, with the centre being at x = 0
  for (let connection_number = 0; connection_number < track_widths.length; connection_number++) {
    const [pad_start_x, pad_start_y, pad_finish_x, pad_finish_y] = calc_pad_coordinates(segment_number, connection_number);
    draw_rect_poly_transform(segment_number, String(connection_number), top_layer_number, polygon_draw_width, pad_start_x, pad_start_y, pad_finish_x, pad_finish_y);
  }

  // now complete the tracks
  for (let connection_number = 0; connection_number < track_widths.length; connection_number++)
    draw_connection(segment_number, connection_number, closest_centre_x_connection);

  draw_outer_cut(segment_number, closest_centre_x_connection);
  draw_vias_all(segment_number);
}

function output_eagle_script() {
  for (let index = 0; index < track_widths.length; index++)
    track_widths[index] = parseFloat(track_widths[index]);

  for (let segment_number = 0; segment_number < segment_length.length; segment_number++) {
    if (segment_number === 0) {
      draw_end(segment_number);
    } else if (segment_number === segment_length.length - 1) {
      draw_next_connection(segment_number - 1);
      draw_end(segment_number);
    } else {
      draw_next_connection(segment_number - 1);
      draw_inner(segment_number);
    }
  }
}

/* ------------------------ MITER post-processing ----------------------- */
/* Eagle's MITER rounds the corner where two wires meet at the given point.
   Find the two outline wires sharing that endpoint, trim them back and
   insert a tangent fillet arc. */
function apply_miters() {
  const EPS = 1e-4;

  for (const m of miters) {
    if (!(m.radius > 0)) continue;

    const touching = [];
    for (const p of primitives) {
      if (p.type !== 'wire') continue;
      if (Math.abs(p.x1 - m.x) < EPS && Math.abs(p.y1 - m.y) < EPS) touching.push({ w: p, end: 1 });
      else if (Math.abs(p.x2 - m.x) < EPS && Math.abs(p.y2 - m.y) < EPS) touching.push({ w: p, end: 2 });
      if (touching.length === 2) break;
    }
    if (touching.length < 2) continue;

    const other = t => t.end === 1 ? [t.w.x2, t.w.y2] : [t.w.x1, t.w.y1];
    const [ax, ay] = other(touching[0]);
    const [bx, by] = other(touching[1]);

    const la = Math.hypot(ax - m.x, ay - m.y);
    const lb = Math.hypot(bx - m.x, by - m.y);
    if (la < EPS || lb < EPS) continue;

    const ux = (ax - m.x) / la, uy = (ay - m.y) / la;
    const vx = (bx - m.x) / lb, vy = (by - m.y) / lb;

    const dot = Math.min(1, Math.max(-1, ux * vx + uy * vy));
    const theta = Math.acos(dot);
    if (theta < 1e-3 || Math.PI - theta < 1e-3) continue;    // collinear or degenerate

    const t = m.radius / Math.tan(theta / 2);
    if (t > la - EPS || t > lb - EPS) continue;              // fillet doesn't fit

    const pax = m.x + ux * t, pay = m.y + uy * t;            // tangent points
    const pbx = m.x + vx * t, pby = m.y + vy * t;

    let bxn = ux + vx, byn = uy + vy;                        // bisector
    const bl = Math.hypot(bxn, byn);
    const cx = m.x + (bxn / bl) * (m.radius / Math.sin(theta / 2));
    const cy = m.y + (byn / bl) * (m.radius / Math.sin(theta / 2));

    const set = (t_, x, y) => { if (t_.end === 1) { t_.w.x1 = x; t_.w.y1 = y; } else { t_.w.x2 = x; t_.w.y2 = y; } };
    set(touching[0], pax, pay);
    set(touching[1], pbx, pby);

    const a1 = Math.atan2(pay - cy, pax - cx);
    const a2 = Math.atan2(pby - cy, pbx - cx);
    let delta = a2 - a1;
    while (delta > Math.PI) delta -= 2 * Math.PI;
    while (delta < -Math.PI) delta += 2 * Math.PI;

    primitives.push({ type: 'fillet', layer: touching[0].w.layer, width: touching[0].w.width,
                      cx, cy, r: m.radius, a1, a2, ccw: delta > 0 });
  }
}

/* -------------------- polygon curve segment geometry ------------------ */
/* Matches Eagle's POLYGON vertex `@value` semantics: |value| is the arc
   RADIUS and the minor arc is drawn (verified against the Eagle-exported
   reference PNGs - wide pads get a shallow bulge, narrow pads are nearly
   flat). Radii smaller than half the chord clamp to a semicircle.
   Positive bulges to the right of the direction of travel, negative left. */
function solve_poly_arc(x1, y1, x2, y2, curve) {
  const d = Math.hypot(x2 - x1, y2 - y1);
  if (d < 1e-9) return null;

  let R = Math.abs(curve);
  if (R < d / 2) R = d / 2;

  const tx = (x2 - x1) / d, ty = (y2 - y1) / d;
  const sign = curve > 0 ? 1 : -1;
  const nx = ty * sign, ny = -tx * sign;                     // unit normal on the bulge side (world coords, y up)

  const k = Math.sqrt(Math.max(0, R * R - (d * d) / 4));
  const mx = (x1 + x2) / 2, my = (y1 + y2) / 2;

  const cx = mx - nx * k;                                    // minor arc: centre opposite the bulge
  const cy = my - ny * k;

  const a1 = Math.atan2(y1 - cy, x1 - cx);
  const a2 = Math.atan2(y2 - cy, x2 - cx);
  const aApex = Math.atan2((cy + ny * R) - cy, (cx + nx * R) - cx);

  const mod2pi = a => ((a % (2 * Math.PI)) + 2 * Math.PI) % (2 * Math.PI);
  const ccwSweep = mod2pi(a2 - a1);
  const apexOff = mod2pi(aApex - a1);
  const ccw = apexOff <= ccwSweep + 1e-9;                    // sweep must pass through the apex

  return { cx, cy, r: R, a1, a2, ccw };
}

/* ------------------------------ rendering ----------------------------- */
const canvas = document.getElementById('board');
const ctx = canvas.getContext('2d');
const errorBox = document.getElementById('error');
const statusBox = document.getElementById('status');

/* Colour schemes. `board` fills the assembled outline loop (the kapton),
   `coverlay` is re-tinted over the traces to fake the translucent film,
   `pads` styles the copper polygons separately from the traces. */
const SCHEMES = {
  eagle: {
    label: 'Eagle', bg: '#ffffff',
    copper: '#ffad22', pads: '#ffad22',
    outline: '#466f8c',
    reinforcement: '#297995', reinforcementFill: 'rgba(41, 121, 149, 0.15)', reinforcementDash: true,
    via: '#ff2323', viaHole: '#ffffff',
    board: 'rgba(70, 111, 140, 0.10)', coverlay: null,
    highlight: '#00b8e6',
    defaults: { fillBoard: false, fillReinforcement: false },
  },
  realistic: {
    label: 'Realistic', bg: '#e5e9ec',
    copper: '#c8823a', pads: '#dfe2e6',
    outline: '#8a5a1c',
    reinforcement: '#a8752c', reinforcementFill: 'rgba(224, 138, 30, 0.40)', reinforcementDash: false,
    via: '#dfe2e6', viaHole: '#403020',
    board: 'rgba(224, 138, 30, 0.45)', coverlay: 'rgba(224, 138, 30, 0.40)',
    highlight: '#2f80ed',
    defaults: { fillBoard: true, fillReinforcement: true },
  },
  dark: {
    label: 'Dark', bg: '#14181d',
    copper: '#ffad22', pads: '#ffad22',
    outline: '#8fb4d1',
    reinforcement: '#35a3b8', reinforcementFill: 'rgba(53, 163, 184, 0.20)', reinforcementDash: true,
    via: '#ff5252', viaHole: '#14181d',
    board: 'rgba(255, 255, 255, 0.06)', coverlay: null,
    highlight: '#00e5ff',
    defaults: { fillBoard: false, fillReinforcement: false },
  },
};

const appearance = {
  scheme: 'eagle',
  fillBoard: false,
  fillReinforcement: false,
  dashGap: 7,           // px between dashes on unpoured (dashed) outlines
  layers: { copper: true, outline: true, reinforcement: true, vias: true },
};

function schemeNow() { return SCHEMES[appearance.scheme]; }

const view = { x: 0, y: 0, scale: 10 };                     // world centre + px per mm

function worldToScreen(x, y) {
  const w = canvas.clientWidth, h = canvas.clientHeight;
  return [(x - view.x) * view.scale + w / 2, (view.y - y) * view.scale + h / 2];
}

function primBounds(p, ext) {
  const grow = (x, y, r) => {
    ext.minX = Math.min(ext.minX, x - r); ext.maxX = Math.max(ext.maxX, x + r);
    ext.minY = Math.min(ext.minY, y - r); ext.maxY = Math.max(ext.maxY, y + r);
  };
  if (p.type === 'wire') { grow(p.x1, p.y1, p.width / 2); grow(p.x2, p.y2, p.width / 2); }
  else if (p.type === 'via') { grow(p.x, p.y, p.diameter / 2); }
  else if (p.type === 'polygon') { for (const pt of p.points) grow(pt.x, pt.y, p.width / 2); }
  else if (p.type === 'fillet') { grow(p.cx + p.r * Math.cos(p.a1), p.cy + p.r * Math.sin(p.a1), p.width / 2); grow(p.cx + p.r * Math.cos(p.a2), p.cy + p.r * Math.sin(p.a2), p.width / 2); }
  else if (p.type === 'arc') {
    const g = eagleArcGeometry(p);
    if (!g) return;
    const steps = 32;
    let sweep = g.ccw ? mod2pi(g.a2 - g.a1) : -mod2pi(g.a1 - g.a2);
    for (let i = 0; i <= steps; i++) {
      const a = g.a1 + sweep * (i / steps);
      grow(g.cx + g.r * Math.cos(a), g.cy + g.r * Math.sin(a), p.width / 2);
    }
  }
}

const mod2pi = a => ((a % (2 * Math.PI)) + 2 * Math.PI) % (2 * Math.PI);

/* Eagle ARC: start point, point diametrically opposite the start, end-angle point */
function eagleArcGeometry(p) {
  const cx = (p.x1 + p.dx) / 2, cy = (p.y1 + p.dy) / 2;
  const r = Math.hypot(p.x1 - cx, p.y1 - cy);
  if (r < 1e-9) return null;
  const a1 = Math.atan2(p.y1 - cy, p.x1 - cx);
  const a2 = Math.atan2(p.y2 - cy, p.x2 - cx);
  return { cx, cy, r, a1, a2, ccw: !p.clockwise };
}

function computeBounds() {
  const ext = { minX: Infinity, minY: Infinity, maxX: -Infinity, maxY: -Infinity };
  for (const p of primitives) primBounds(p, ext);
  return ext.minX === Infinity ? null : ext;
}

function fitView() {
  stopMomentum();
  const b = computeBounds();
  if (!b) return;
  const w = canvas.clientWidth, h = canvas.clientHeight;
  const pad = 40;
  view.scale = Math.min((w - pad * 2) / Math.max(0.001, b.maxX - b.minX),
                        (h - pad * 2) / Math.max(0.001, b.maxY - b.minY));
  view.scale = Math.min(Math.max(view.scale, 0.01), 2000);
  view.x = (b.minX + b.maxX) / 2;
  view.y = (b.minY + b.maxY) / 2;
  render();
}

/* draw a world-space arc into the current path (canvas y is flipped, so
   world angles negate and the sweep direction inverts) */
function pathArc(g) {
  const [sx, sy] = worldToScreen(g.cx, g.cy);
  ctx.arc(sx, sy, g.r * view.scale, -g.a1, -g.a2, g.ccw);
}

/* assemble the outline-layer wires/arcs/fillets into closed loops so the
   board substrate (kapton) can be filled. Returns null if no closed loop
   can be chained (e.g. mid-edit geometry). Cached until regeneration. */
let outline_loops = null;

function build_outline_loop() {
  const edges = [];
  for (const p of primitives) {
    if (p.layer !== outline_layer_number) continue;
    if (p.type === 'wire') {
      if (Math.hypot(p.x2 - p.x1, p.y2 - p.y1) < 1e-6) continue;   // zero-length segments break chaining
      edges.push({ kind: 'line', a: [p.x1, p.y1], b: [p.x2, p.y2] });
    } else if (p.type === 'fillet') {
      edges.push({ kind: 'arc', g: { cx: p.cx, cy: p.cy, r: p.r, a1: p.a1, a2: p.a2, ccw: p.ccw },
                   a: [p.cx + p.r * Math.cos(p.a1), p.cy + p.r * Math.sin(p.a1)],
                   b: [p.cx + p.r * Math.cos(p.a2), p.cy + p.r * Math.sin(p.a2)] });
    } else if (p.type === 'arc') {
      const g = eagleArcGeometry(p);
      if (!g) continue;
      edges.push({ kind: 'arc', g, a: [p.x1, p.y1], b: [p.x2, p.y2] });
    }
  }
  if (!edges.length) return null;

  const close = (p, q) => Math.hypot(p[0] - q[0], p[1] - q[1]) < 0.05;
  const used = new Array(edges.length).fill(false);
  const loops = [];

  for (let s = 0; s < edges.length; s++) {
    if (used[s]) continue;
    const loop = [{ e: edges[s], rev: false }];
    used[s] = true;
    const start = edges[s].a;
    let cur = edges[s].b;
    let guard = edges.length + 2;
    let closed = false;
    while (guard-- > 0) {
      if (loop.length > 2 && close(cur, start)) { closed = true; break; }
      let found = false;
      for (let i = 0; i < edges.length; i++) {
        if (used[i]) continue;
        if (close(edges[i].a, cur)) { used[i] = true; loop.push({ e: edges[i], rev: false }); cur = edges[i].b; found = true; break; }
        if (close(edges[i].b, cur)) { used[i] = true; loop.push({ e: edges[i], rev: true }); cur = edges[i].a; found = true; break; }
      }
      if (!found) break;
    }
    if (closed) loops.push(loop);
  }
  return loops.length ? loops : null;
}

function fillBoardPath(color) {
  if (outline_loops === null) outline_loops = build_outline_loop() || false;
  if (!outline_loops) return;
  ctx.beginPath();
  for (const loop of outline_loops) {
    let first = true;
    for (const step of loop) {
      const a = step.rev ? step.e.b : step.e.a;
      const b = step.rev ? step.e.a : step.e.b;
      if (first) { ctx.moveTo(...worldToScreen(a[0], a[1])); first = false; }
      if (step.e.kind === 'line') {
        ctx.lineTo(...worldToScreen(b[0], b[1]));
      } else {
        const g = step.e.g;
        const [sx, sy] = worldToScreen(g.cx, g.cy);
        if (!step.rev) ctx.arc(sx, sy, g.r * view.scale, -g.a1, -g.a2, g.ccw);
        else ctx.arc(sx, sy, g.r * view.scale, -g.a2, -g.a1, !g.ccw);
      }
    }
    ctx.closePath();
  }
  ctx.fillStyle = color;
  ctx.fill();
}

function polygonPath(p) {
  ctx.beginPath();
  ctx.moveTo(...worldToScreen(p.points[0].x, p.points[0].y));
  for (let i = 0; i < p.points.length - 1; i++) {
    const a = p.points[i], b = p.points[i + 1];
    if (a.curve) {
      const g = solve_poly_arc(a.x, a.y, b.x, b.y, a.curve);
      if (g) pathArc(g); else ctx.lineTo(...worldToScreen(b.x, b.y));
    } else {
      ctx.lineTo(...worldToScreen(b.x, b.y));
    }
  }
  ctx.closePath();
}

function drawStrokePrimitive(p, color) {
  ctx.strokeStyle = color;
  ctx.setLineDash([]);
  ctx.lineWidth = Math.max(p.width * view.scale, 0.5);
  ctx.beginPath();
  if (p.type === 'wire') {
    ctx.moveTo(...worldToScreen(p.x1, p.y1));
    ctx.lineTo(...worldToScreen(p.x2, p.y2));
  } else if (p.type === 'arc') {
    const g = eagleArcGeometry(p);
    if (!g) return;
    pathArc(g);
  } else {
    pathArc(p);   // fillet
  }
  ctx.stroke();
}

function drawVia(p) {
  const S = schemeNow();
  ctx.setLineDash([]);
  const [sx, sy] = worldToScreen(p.x, p.y);
  ctx.beginPath();
  ctx.arc(sx, sy, Math.max((p.diameter / 2) * view.scale, 1.5), 0, 2 * Math.PI);
  ctx.fillStyle = S.via;
  ctx.fill();
  ctx.beginPath();
  ctx.arc(sx, sy, Math.max((p.drill / 2) * view.scale, 0.75), 0, 2 * Math.PI);
  ctx.fillStyle = S.viaHole;
  ctx.fill();
}

function render() {
  const dpr = window.devicePixelRatio || 1;
  const w = canvas.clientWidth, h = canvas.clientHeight;
  if (canvas.width !== Math.round(w * dpr) || canvas.height !== Math.round(h * dpr)) {
    canvas.width = Math.round(w * dpr);
    canvas.height = Math.round(h * dpr);
  }
  const S = schemeNow();
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.fillStyle = S.bg;
  ctx.fillRect(0, 0, w, h);
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';

  // board substrate (kapton)
  ctx.globalAlpha = focusTag && focusTag !== 'outline' ? FOCUS_DIM : 1;
  if (appearance.fillBoard) fillBoardPath(S.board);

  // copper traces
  if (appearance.layers.copper)
    for (const p of primitives)
      if ((p.type === 'wire' || p.type === 'arc') && p.layer === top_layer_number) {
        ctx.globalAlpha = alphaFor(p);
        drawStrokePrimitive(p, selectedTracks.has(p.net) ? S.highlight : S.copper);
      }

  // translucent coverlay tint over the traces (realistic scheme)
  ctx.globalAlpha = focusTag && focusTag !== 'outline' ? FOCUS_DIM : 1;
  if (appearance.fillBoard && S.coverlay) fillBoardPath(S.coverlay);

  // copper pads (exposed / tinned, so above the coverlay)
  if (appearance.layers.copper)
    for (const p of primitives)
      if (p.type === 'polygon' && p.layer === top_layer_number) {
        ctx.globalAlpha = alphaFor(p);
        const color = selectedTracks.has(p.net) ? S.highlight : S.pads;
        polygonPath(p);
        ctx.fillStyle = color;
        ctx.strokeStyle = color;
        ctx.setLineDash([]);
        ctx.lineWidth = Math.max(p.width * view.scale, 0.5);
        ctx.fill();
        ctx.stroke();
      }

  // reinforcement overlay
  if (appearance.layers.reinforcement)
    for (const p of primitives)
      if (p.type === 'polygon' && p.layer === reinforcement_layer_number) {
        ctx.globalAlpha = alphaFor(p);
        polygonPath(p);
        if (appearance.fillReinforcement) {
          ctx.fillStyle = S.reinforcementFill;
          ctx.fill();
        }
        ctx.strokeStyle = S.reinforcement;
        const dashed = S.reinforcementDash && !appearance.fillReinforcement;
        ctx.setLineDash(dashed ? [5, appearance.dashGap] : []);
        ctx.lineWidth = Math.max(p.width * view.scale, dashed ? 1.2 : 0.5);
        ctx.stroke();
      }

  // board outline
  if (appearance.layers.outline)
    for (const p of primitives)
      if ((p.type === 'wire' || p.type === 'arc' || p.type === 'fillet') && p.layer === outline_layer_number) {
        ctx.globalAlpha = alphaFor(p);
        drawStrokePrimitive(p, S.outline);
      }

  // vias
  if (appearance.layers.vias)
    for (const p of primitives)
      if (p.type === 'via') {
        ctx.globalAlpha = alphaFor(p);
        drawVia(p);
      }

  ctx.globalAlpha = 1;
  drawMeasureOverlay();

  const b = computeBounds();
  if (b) statusBox.textContent =
    `Board ${ (b.maxX - b.minX).toFixed(1) } × ${ (b.maxY - b.minY).toFixed(1) } mm · ${track_widths.length} tracks · ${view.scale.toFixed(1)} px/mm`;
}

function drawMeasureOverlay() {
  if (!measure.a) return;
  const end = measure.b || measure.cursor;
  if (!end) return;
  const [ax, ay] = worldToScreen(measure.a[0], measure.a[1]);
  const [bx, by] = worldToScreen(end[0], end[1]);
  ctx.setLineDash([]);
  ctx.strokeStyle = '#ff3d71';
  ctx.fillStyle = '#ff3d71';
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(ax, ay);
  ctx.lineTo(bx, by);
  ctx.stroke();
  for (const [px, py] of [[ax, ay], [bx, by]]) {
    ctx.beginPath();
    ctx.arc(px, py, 3.5, 0, 2 * Math.PI);
    ctx.fill();
  }
  const dx = end[0] - measure.a[0], dy = end[1] - measure.a[1];
  const label = `${Math.hypot(dx, dy).toFixed(3)} mm  (Δx ${dx.toFixed(3)}, Δy ${dy.toFixed(3)})`;
  ctx.font = '12px -apple-system, sans-serif';
  const tw = ctx.measureText(label).width;
  const lx = (ax + bx) / 2 + 10, ly = (ay + by) / 2 - 10;
  ctx.fillStyle = 'rgba(28, 33, 40, 0.9)';
  ctx.fillRect(lx - 4, ly - 13, tw + 8, 18);
  ctx.fillStyle = '#fff';
  ctx.fillText(label, lx, ly);
}

/* --------------------- selection, measuring, electrical --------------- */
const selectedTracks = new Set();
const measure = { active: false, a: null, b: null, cursor: null };

/* copper resistivity 1.72e-8 ohm.m; IPC-2221 external-conductor current capacity */
const electrical = { thickness_um: 35, deltaT: 10, reqCurrent: 0, maxDropMV: 0 };

function track_resistance(i) {          // ohms
  return 0.0172 * (track_lengths[i] || 0) / (state.track_widths[i] * electrical.thickness_um);
}
function track_imax(width_mm) {         // amps, IPC-2221: I = 0.048 * dT^0.44 * A[mil^2]^0.725
  return 0.048 * Math.pow(electrical.deltaT, 0.44) * Math.pow(1.55 * width_mm * electrical.thickness_um, 0.725);
}
function width_for_current(amps) {      // mm, inverse of track_imax
  return Math.pow(amps / (0.048 * Math.pow(electrical.deltaT, 0.44)), 1 / 0.725) / (1.55 * electrical.thickness_um);
}
function width_for_drop(i, amps, drop_v) {  // mm, from R <= V/I
  return 0.0172 * (track_lengths[i] || 0) * amps / (electrical.thickness_um * drop_v);
}
function required_width(i) {
  const I = electrical.reqCurrent, V = electrical.maxDropMV / 1000;
  let w = 0.05;
  if (I > 0) w = Math.max(w, width_for_current(I));
  if (I > 0 && V > 0) w = Math.max(w, width_for_drop(i, I, V));
  return Math.ceil(w / 0.05) * 0.05;
}

/* ------------------------------- exports ------------------------------ */
function download(filename, text) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text], { type: 'text/plain' }));
  a.download = filename;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 5000);
}

function state_matches_preset(name) {
  const p = PRESETS[name];
  return p && Object.keys(p).every(k => JSON.stringify(p[k]) === JSON.stringify(state[k]));
}

const export_base = () => {
  const name = document.getElementById('preset').value;
  return state_matches_preset(name) ? name : 'ffsc-custom';
};

/* Eagle script - byte-compatible with the original Python generator's output */
function build_scr_text(name = export_base()) {
  let t = '';
  t += '#Draws the outline of the flexible connector system;\n';
  t += 'Grid mm 1 off;\n';
  t += 'DRC LOAD drc-disable.dru;\n';
  t += 'SET WIRE_BEND 2;\n';
  t += 'SET PALETTE WHITE;\n';
  t += 'SET PALETTE 16 0xff297995;\n';
  t += 'SET PALETTE 24 0xFF2A597A;\n';
  t += 'SET COLOR_LAYER 1 16;\n';
  t += 'SET PALETTE 17 0xffffad22;\n';
  t += 'SET PALETTE 25 0xFF00FCFF;\n';
  t += 'SET COLOR_LAYER 16 17;\n';
  t += 'SET PALETTE 18 0xFFFF2323;\n';
  t += 'SET PALETTE 26 0xCCFF2323;\n';
  t += 'SET COLOR_LAYER 18 18;\n';
  t += 'SET PALETTE 19 0xFF466f8c;\n';
  t += 'SET PALETTE 27 0xCCff6833;\n';
  t += 'SET COLOR_LAYER 20 19;\n';
  t += 'WINDOW;\n';
  t += scr_lines.join('');
  for (let i = 0; i < track_widths.length; i++)
    t += `RATSNEST ${net_name_prefix}${i};\n`;
  t += 'RIPUP net_reinforcement;\n';
  t += 'WINDOW FIT;\n';
  t += `EXPORT IMAGE ${name}.png 600;\n`;
  t += 'WRITE;\n';
  return t;
}

/* ---------------------------- self-test ------------------------------- */
/* SHA-256 of the .scr each preset must generate. These pin the current
   generator output, which matches the Python reference outputs in
   examples/outputs/ except for intentional bug fixes: the overshoot
   off-by-one (shifts parameters_4's end tapers by 0.18 mm) and the
   pad-arc radius doubling (the reinforcement arc values in every preset -
   the drawn arc height now equals pad_arc_height, capped at a semicircle,
   where the original drew a much flatter arc). */
const GOLDEN_SCR_SHA256 = {
  parameters_1: 'f2fac3acf211b5430130666c6237e24bed96a24717889079646278d410f6f8c7',
  parameters_2: 'f08f97eadcb7173dd9d1f17b57941af0c3f5417464c2b23517abbd1047055280',
  parameters_3: '62b6b711212e605d7d3d417a8e593244595136dc5a16aee9996b5a20bcef8f31',
  parameters_4: '53fda9f14242d92903f9aa4c4a17177819c62a766fe6ad1470a1e549e2fc7330',
  parameters_5: '54d4f92301b63ff27d535d31b0f3dcd3631d13396a1065084a9462f3217ec45b',
};

async function run_self_test() {
  const saved = JSON.stringify(state);
  const results = [];
  try {
    for (const [name, golden] of Object.entries(GOLDEN_SCR_SHA256)) {
      Object.assign(state, JSON.parse(JSON.stringify(PRESETS[name])));
      apply_params(state);
      primitives = []; miters = []; current_polygon = null;
      scr_lines = []; track_lengths = [];
      override_inter_track_spacing_angle = 0;
      output_eagle_script();
      const text = build_scr_text(name);
      const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(text));
      const hex = [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, '0')).join('');
      results.push({ name, pass: hex === golden });
    }
  } catch (e) {
    results.push({ name: 'exception: ' + e.message, pass: false });
  } finally {
    Object.assign(state, JSON.parse(saved));
    refreshPanelValues();
    regenerate();
  }
  return results;
}

/* signed sweep angle in degrees (positive = CCW), as Eagle's `curve` attribute expects */
function sweep_deg(g) {
  const s = g.ccw ? mod2pi(g.a2 - g.a1) : -mod2pi(g.a1 - g.a2);
  return s * 180 / Math.PI;
}

/* Eagle 9.x XML board. Geometry mirrors what Eagle itself produces from the
   script: outline (with miters already applied as curved wires) in <plain>,
   copper + vias grouped per signal, reinforcement as its own signal. */
function build_brd_text() {
  const NL = '\n';
  let plain = '';
  for (const p of primitives) {
    if (p.layer !== outline_layer_number) continue;
    if (p.type === 'wire') {
      plain += `<wire x1="${g6(p.x1)}" y1="${g6(p.y1)}" x2="${g6(p.x2)}" y2="${g6(p.y2)}" width="${g6(p.width)}" layer="20"/>` + NL;
    } else if (p.type === 'fillet') {
      const x1 = p.cx + p.r * Math.cos(p.a1), y1 = p.cy + p.r * Math.sin(p.a1);
      const x2 = p.cx + p.r * Math.cos(p.a2), y2 = p.cy + p.r * Math.sin(p.a2);
      plain += `<wire x1="${g6(x1)}" y1="${g6(y1)}" x2="${g6(x2)}" y2="${g6(y2)}" width="${g6(p.width)}" layer="20" curve="${g6(sweep_deg(p))}"/>` + NL;
    } else if (p.type === 'arc') {
      const g = eagleArcGeometry(p);
      if (!g) continue;
      plain += `<wire x1="${g6(p.x1)}" y1="${g6(p.y1)}" x2="${g6(p.x2)}" y2="${g6(p.y2)}" width="${g6(p.width)}" layer="20" curve="${g6(sweep_deg(g))}"/>` + NL;
    }
  }

  const polygon_xml = (p, layer) => {
    let s = `<polygon width="${g6(p.width)}" layer="${layer}">` + NL;
    const pts = p.points.slice();
    if (pts.length > 1 && Math.hypot(pts[pts.length - 1].x - pts[0].x, pts[pts.length - 1].y - pts[0].y) < 1e-9)
      pts.pop();
    for (let i = 0; i < pts.length; i++) {
      const a = pts[i], b = pts[(i + 1) % pts.length];
      let curveAttr = '';
      if (a.curve) {
        const g = solve_poly_arc(a.x, a.y, b.x, b.y, a.curve);
        if (g) curveAttr = ` curve="${g6(sweep_deg(g))}"`;
      }
      s += `<vertex x="${g6(a.x)}" y="${g6(a.y)}"${curveAttr}/>` + NL;
    }
    return s + '</polygon>' + NL;
  };

  let signals = '';
  for (let i = 0; i < track_widths.length; i++) {
    signals += `<signal name="NET_${i}">` + NL;
    for (const p of primitives) {
      if (p.net !== i) continue;
      if (p.type === 'polygon') signals += polygon_xml(p, p.layer);
      else if (p.type === 'wire') signals += `<wire x1="${g6(p.x1)}" y1="${g6(p.y1)}" x2="${g6(p.x2)}" y2="${g6(p.y2)}" width="${g6(p.width)}" layer="${p.layer}"/>` + NL;
      else if (p.type === 'arc') {
        const g = eagleArcGeometry(p);
        if (g) signals += `<wire x1="${g6(p.x1)}" y1="${g6(p.y1)}" x2="${g6(p.x2)}" y2="${g6(p.y2)}" width="${g6(p.width)}" layer="${p.layer}" curve="${g6(sweep_deg(g))}"/>` + NL;
      }
    }
    for (const p of primitives)
      if (p.type === 'via' && p.signal === `${net_name_prefix}${i}`)
        signals += `<via x="${g6(p.x)}" y="${g6(p.y)}" extent="1-16" drill="${g6(p.drill)}" diameter="${g6(p.diameter)}"/>` + NL;
    signals += '</signal>' + NL;
  }
  signals += '<signal name="NET_REINFORCEMENT">' + NL;
  for (const p of primitives)
    if (p.type === 'polygon' && p.layer === reinforcement_layer_number)

  const layer = (n, name, color, fill, visible) =>

  const layers = [
    layer(1, 'Top', 16, 1, 'yes'), layer(16, 'Bottom', 17, 1, 'yes'),
    layer(17, 'Pads', 2, 1, 'yes'), layer(18, 'Vias', 18, 1, 'yes'),
    layer(19, 'Unrouted', 6, 1, 'yes'), layer(20, 'Dimension', 19, 1, 'yes'),
    layer(21, 'tPlace', 7, 1, 'yes'), layer(22, 'bPlace', 7, 1, 'yes'),
    layer(23, 'tOrigins', 15, 1, 'yes'), layer(24, 'bOrigins', 15, 1, 'yes'),
    layer(25, 'tNames', 7, 1, 'yes'), layer(26, 'bNames', 7, 1, 'yes'),
    layer(27, 'tValues', 7, 1, 'yes'), layer(28, 'bValues', 7, 1, 'yes'),
    layer(29, 'tStop', 7, 3, 'no'), layer(30, 'bStop', 7, 6, 'no'),
